<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ditu — Acceso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0024;color:#e8eaf0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1a0a35;border:1px solid rgba(180,140,255,0.2);border-radius:20px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.brand{text-align:center;margin-bottom:32px}
.brand-ditu{font-size:52px;font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,#fff,#c3a0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{color:#7c82a0;font-size:13px;margin-top:4px}
.invite-badge{background:rgba(147,100,255,0.15);border:1px solid rgba(147,100,255,0.3);border-radius:8px;padding:10px 14px;margin-bottom:20px;font-size:13px;color:#c3a0ff;text-align:center}
label{display:block;font-size:11px;font-weight:700;color:#7c82a0;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.field{margin-bottom:18px}
input{width:100%;background:#0f0024;border:1px solid rgba(180,140,255,0.2);border-radius:10px;color:#fff;padding:12px 14px;font-size:14px;font-family:inherit;transition:border .15s;outline:none}
input:focus{border-color:#9b6dff}
.hint{font-size:11px;color:#7c82a0;margin-top:5px}
.btn{width:100%;background:#9b6dff;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;margin-top:4px}
.btn:hover{background:#8055ee}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{background:#3a1a1a;border:1px solid #f87171;border-radius:8px;color:#f87171;font-size:13px;padding:10px 14px;margin-bottom:16px;display:none}
.success{background:#0f2e1a;border:1px solid #4ade80;border-radius:8px;color:#4ade80;font-size:13px;padding:10px 14px;margin-bottom:16px;display:none}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.screen{display:none}
.screen.active{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="./ditu_gif_pequeno.gif" alt="ditu" style="width:180px;height:auto;display:block;margin:0 auto 8px">
    <div class="brand-ditu">ditu</div>
  </div>

  <!-- Pantalla: Login normal -->
  <div id="screenLogin" class="screen active">
    <div class="error" id="loginErr"></div>
    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Ingresar</button>
  </div>

  <!-- Pantalla: Crear contraseña (invitación) -->
  <div id="screenInvite" class="screen">
    <div class="invite-badge">🎉 ¡Bienvenido! Crea tu contraseña para activar tu cuenta.</div>
    <div class="error" id="inviteErr"></div>
    <div class="success" id="inviteOk"></div>
    <div class="field">
      <label>Nueva contraseña</label>
      <input type="password" id="newPwd" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      <div class="hint">Mínimo 8 caracteres</div>
    </div>
    <div class="field">
      <label>Confirmar contraseña</label>
      <input type="password" id="confirmPwd" placeholder="Repite tu contraseña" autocomplete="new-password"
        onkeydown="if(event.key==='Enter')doSetPassword()">
    </div>
    <button class="btn" id="setPwdBtn" onclick="doSetPassword()">Activar cuenta</button>
  </div>
</div>

<script>
const SUPA_URL='https://akpuifenfstvobwtqtcq.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrcHVpZmVuZnN0dm9id3RxdGNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDMxOTAsImV4cCI6MjEwMjM3OTE5MH0.5397pVE5XlyV2864iTf96Ttj--HqoffovzJ9Z9mI0ig';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

(async()=>{
  // Detectar si viene de un link de invitación (tiene token en el hash)
  const hash=window.location.hash;
  if(hash.includes('type=invite')||hash.includes('type=recovery')){
    // Supabase procesa el token automáticamente al crear el cliente
    // Esperamos a que la sesión esté lista
    const{data:{session},error}=await sb.auth.getSession();
    if(session){
      showScreen('screenInvite');
      return;
    }
    // Si aún no hay sesión, escuchar el evento de auth
    sb.auth.onAuthStateChange((event,session)=>{
      if((event==='SIGNED_IN'||event==='USER_UPDATED')&&session){
        showScreen('screenInvite');
      }
    });
    return;
  }

  // Login normal: si ya hay sesión activa, ir al checklist
  const{data:{session}}=await sb.auth.getSession();
  if(session) window.location.href='./checklist.html';
})();

async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pwd=document.getElementById('pwd').value;
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('loginErr');
  err.style.display='none';
  if(!email||!pwd){err.textContent='Completa correo y contraseña.';err.style.display='block';return;}
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  const{error}=await sb.auth.signInWithPassword({email,password:pwd});
  if(error){
    err.textContent=error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':error.message;
    err.style.display='block';
    btn.disabled=false;btn.textContent='Ingresar';
  }else{
    window.location.href='./checklist.html';
  }
}

async function doSetPassword(){
  const pwd=document.getElementById('newPwd').value;
  const confirm=document.getElementById('confirmPwd').value;
  const btn=document.getElementById('setPwdBtn');
  const err=document.getElementById('inviteErr');
  const ok=document.getElementById('inviteOk');
  err.style.display='none';ok.style.display='none';

  if(pwd.length<8){err.textContent='La contraseña debe tener al menos 8 caracteres.';err.style.display='block';return;}
  if(pwd!==confirm){err.textContent='Las contraseñas no coinciden.';err.style.display='block';return;}

  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Activando...';
  const{error}=await sb.auth.updateUser({password:pwd});
  if(error){
    err.textContent=error.message;
    err.style.display='block';
    btn.disabled=false;btn.textContent='Activar cuenta';
  }else{
    ok.textContent='¡Cuenta activada! Ingresando...';
    ok.style.display='block';
    setTimeout(()=>window.location.href='./checklist.html',1500);
  }
}
</script>
</body>
</html>
