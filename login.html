<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ditu — Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@300;400;600;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1a1a;
  color:#e8eaf0;
  font-family:'Encode Sans Expanded','Helvetica Neue',Arial,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  background:#222;
  border:1px solid rgba(142,101,216,0.25);
  border-radius:20px;
  padding:44px 36px 40px;
  width:100%;
  max-width:380px;
  box-shadow:0 24px 64px rgba(0,0,0,.6);
}
.brand{text-align:center;margin-bottom:36px}
.brand-logo{height:36px;width:auto;display:block;margin:0 auto}
.brand-product{
  margin-top:14px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#555;
}
.brand-product span{color:#8E65D8}

label{display:block;font-size:10px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.field{margin-bottom:18px}
input{
  width:100%;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:10px;
  color:#fff;
  padding:12px 14px;
  font-size:14px;
  font-family:inherit;
  transition:border .15s;
  outline:none;
}
input:focus{border-color:#8E65D8}
input::placeholder{color:#444}

.btn{
  width:100%;
  background:#97D700;
  color:#1a1a1a;
  border:none;
  border-radius:10px;
  padding:13px;
  font-size:14px;
  font-weight:900;
  font-family:inherit;
  letter-spacing:.04em;
  cursor:pointer;
  transition:.15s;
  margin-top:4px;
  text-transform:uppercase;
}
.btn:hover{background:#aaee00}
.btn:disabled{opacity:.5;cursor:not-allowed}

.error{
  background:#2a1212;
  border:1px solid #f87171;
  border-radius:8px;
  color:#f87171;
  font-size:12px;
  padding:10px 14px;
  margin-bottom:16px;
  display:none;
}
.spinner{
  width:18px;height:18px;
  border:2px solid rgba(26,26,26,.3);
  border-top-color:#1a1a1a;
  border-radius:50%;
  animation:spin .6s linear infinite;
  display:inline-block;
  vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img
      class="brand-logo"
      src="https://cdn.prod.website-files.com/6584479d07aff3fd2a2570e2/6584479d07aff3fd2a25712e_Mediastream-Brand.svg"
      alt="Mediastream"
      onerror="this.style.display='none';document.getElementById('brandFallback').style.display='block'"
    />
    <div id="brandFallback" style="display:none;font-size:22px;font-weight:900;color:#8E65D8;letter-spacing:-1px">Mediastream</div>
  </div>
  <div class="error" id="errMsg"></div>
  <div class="field">
    <label>Correo electrónico</label>
    <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">Ingresar</button>
</div>

<script>
const SUPA_URL='https://akpuifenfstvobwtqtcq.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrcHVpZmVuZnN0dm9id3RxdGNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDMxOTAsImV4cCI6MjEwMjM3OTE5MH0.5397pVE5XlyV2864iTf96Ttj--HqoffovzJ9Z9mI0ig';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session)window.location.href='./select_cliente.html';
})();

async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pwd=document.getElementById('pwd').value;
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('errMsg');
  err.style.display='none';
  if(!email||!pwd){err.textContent='Completa correo y contraseña.';err.style.display='block';return;}
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  const {error}=await sb.auth.signInWithPassword({email,password:pwd});
  if(error){
    err.textContent=error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':error.message;
    err.style.display='block';
    btn.disabled=false;btn.textContent='Ingresar';
  }else{
    window.location.href='./select_cliente.html';
  }
}
</script>
</body>
</html>
