<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Analytics — Checklist QA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@300;400;600;900&display=swap" rel="stylesheet">
<style>
/* ── Tokens ── */
:root{
  --bg:#080A18;--surface:#0E1126;--card:#141A32;
  --border:rgba(80,100,200,0.18);--border2:rgba(80,100,200,0.10);
  --text:#e8eaf0;--muted:#7c82a0;--dim:#4a4f6a;
  --pass:#1baf7a;--fail:#e34948;--na:#898781;--utt:#eda100;
  --green:#97D700;--purple:#8E65D8;
  --grid:rgba(80,100,200,0.10);
  --radius:12px;
  --cliente-color:#7B2FBE;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Encode Sans Expanded','Helvetica Neue',Arial,sans-serif;font-size:13px;background:var(--bg);color:var(--text);line-height:1.5}

/* ── Nav ── */
.sitenav{display:flex;gap:4px;padding:8px 14px;background:#0a0c12;border-bottom:1px solid #1e2235;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.snav-link{color:#7c82a0;font-size:12px;font-weight:600;text-decoration:none;padding:5px 11px;border-radius:7px;transition:.15s;display:flex;align-items:center;gap:6px}
.snav-link:hover{color:#e8eaf0;background:#1a1d27}
.snav-link.active{color:#c3a0ff;background:#1a1d27}
.snav-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{font-size:11px;color:#7c82a0}
.logout-btn{background:none;border:1px solid #2e3350;color:#7c82a0;border-radius:7px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;transition:.15s}
.logout-btn:hover{color:#f87171;border-color:#f87171}
.report-btn{background:#97D700;border:none;color:#0a0c12;border-radius:7px;padding:5px 13px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;gap:5px;letter-spacing:.03em}
.report-btn:hover{background:#b0f200;}
.nav-role-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:none}
.nav-role-badge.superadmin{background:#4f46e5;color:#fff}
.nav-role-badge.admin{background:#1e2035;color:#c3a0ff;border:1px solid #6366f1}
.nav-role-badge.operador{background:#1a2e1f;color:#4ade80;border:1px solid #166534}
.nav-role-badge.viewer{background:#1a1d27;color:#7c82a0;border:1px solid #2e3350}
.cliente-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#e8eaf0;background:#1a1d27;border:1px solid rgba(180,140,255,0.25);border-radius:8px;padding:3px 10px 3px 6px}
.cliente-dot{width:8px;height:8px;border-radius:50%;background:var(--cliente-color,#7B2FBE);flex-shrink:0}

/* ── Layout ── */
.page{max-width:1300px;margin:0 auto;padding:20px 20px 60px}

/* ── Global filter bar ── */
.global-filter-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 16px;margin-bottom:20px;
}
.gfb-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px;white-space:nowrap}
.filter-btn{background:#0E1126;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 13px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.03em}
.filter-btn:hover{color:var(--text);border-color:var(--purple)}
.filter-btn.active{color:#fff;background:var(--purple);border-color:var(--purple)}
.gfb-sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0}
.gfb-select{background:#0E1126;border:1px solid var(--border);color:#fff;padding:5px 12px;border-radius:8px;font-size:11px;outline:none;color-scheme:dark;cursor:pointer;font-family:inherit;font-weight:600}

/* ── Page header ── */
.page-header{margin-bottom:16px}
.page-title{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.3px}
.page-subtitle{font-size:12px;color:var(--muted);margin-top:2px}

/* ── Tabs ── */
.tab-nav{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab-btn{
  font-family:inherit;font-size:12px;font-weight:700;
  background:none;border:none;color:var(--muted);
  padding:8px 18px 10px;cursor:pointer;position:relative;
  border-radius:8px 8px 0 0;transition:.15s;letter-spacing:.02em;
}
.tab-btn:hover{color:var(--text);background:rgba(80,100,200,0.08)}
.tab-btn.active{color:#fff;background:var(--card)}
.tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--purple);border-radius:2px 2px 0 0}
.tab-badge{display:inline-block;background:rgba(142,101,216,0.25);color:#c3a0ff;border-radius:10px;font-size:9px;font-weight:700;padding:1px 7px;margin-left:5px;letter-spacing:.04em}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── KPI tiles ── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--purple))}
.kpi-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.kpi-value{font-size:30px;font-weight:900;color:#fff;line-height:1;letter-spacing:-1px}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:6px}
.kpi-good{--accent:var(--pass)}
.kpi-bad{--accent:var(--fail)}
.kpi-info{--accent:var(--purple)}
.kpi-warn{--accent:var(--utt)}
.kpi-green{--accent:var(--green)}

/* ── Charts grid ── */
.charts-grid-1{margin-bottom:18px}
.charts-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.charts-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:900px){.charts-grid-2,.charts-grid-3{grid-template-columns:1fr}}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px}
.chart-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px}
.chart-desc{font-size:11px;color:var(--muted);margin-bottom:16px}
.chart-wrap{position:relative}

/* ── Section heading ── */
.section-heading{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;margin-top:6px;
}
.section-num{
  width:24px;height:24px;border-radius:50%;background:var(--purple);
  color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.section-title{font-size:14px;font-weight:900;color:#fff;letter-spacing:-.2px}
.section-desc{font-size:11px;color:var(--muted);margin-left:auto}

/* ── Proportion bar list ── */
.prop-list{display:flex;flex-direction:column;gap:10px}
.prop-item{display:flex;flex-direction:column;gap:4px}
.prop-item-header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prop-item-name{font-size:11px;font-weight:600;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop-item-vals{font-size:10px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.prop-bar-track{height:6px;background:rgba(80,100,200,0.12);border-radius:3px;overflow:hidden}
.prop-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.prop-bar-fail{background:var(--fail)}
.prop-bar-platform{background:var(--purple)}

/* ── Decisión / Nivel 3 ── */
.decision-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:18px}
.decision-panel h3{font-size:13px;font-weight:700;color:#fff;margin-bottom:6px}
.decision-panel p{font-size:11px;color:var(--muted);margin-bottom:16px}
.decision-select-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.decision-select{
  flex:1;min-width:200px;background:#0E1126;border:1px solid var(--border);color:#fff;
  padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;
  outline:none;color-scheme:dark;cursor:pointer;font-family:inherit;
}
.decision-select:focus{border-color:var(--purple)}
.narrative-box{
  background:#0E1126;border:1px solid var(--border);border-radius:10px;
  padding:18px 20px;margin-bottom:18px;
}
.narrative-period{font-size:10px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.narrative-text{font-size:14px;color:var(--text);line-height:1.8;font-weight:400}
.narrative-text strong{color:#fff;font-weight:700}
.priority-badge{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:8px;padding:4px 12px;font-size:11px;font-weight:700;margin-bottom:18px;
}
.priority-high{background:rgba(227,73,72,0.15);border:1px solid rgba(227,73,72,0.5);color:#f87171}
.priority-medium{background:rgba(237,161,0,0.15);border:1px solid rgba(237,161,0,0.5);color:#fbbf24}
.priority-low{background:rgba(27,175,122,0.15);border:1px solid rgba(27,175,122,0.5);color:#34d399}
.decision-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.d-kpi{background:#0E1126;border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center}
.d-kpi-val{font-size:28px;font-weight:900;color:#fff;line-height:1;margin-bottom:4px}
.d-kpi-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.d-kpi-sub{font-size:10px;color:var(--dim);margin-top:2px}
.empty-decision{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}
.empty-decision span{font-size:40px;display:block;margin-bottom:12px;opacity:.4}

/* ── Loading/empty ── */
.loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:14px;color:var(--muted);font-size:13px}
.spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{text-align:center;color:var(--muted);padding:40px;font-size:12px}
.footnote{font-size:10px;color:var(--dim);margin-top:8px;text-align:right}

/* ── AI Analysis ── */
.ai-analyze-btn{background:linear-gradient(135deg,#8E65D8,#6b40c4);border:none;color:#fff;border-radius:8px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px;letter-spacing:.03em;white-space:nowrap}
.ai-analyze-btn:hover{background:linear-gradient(135deg,#9e75e8,#7b50d4);transform:translateY(-1px)}
.ai-analyze-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.ai-spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
.ai-result-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ai-badge{font-size:10px;font-weight:700;background:rgba(142,101,216,0.25);color:#c3a0ff;border-radius:10px;padding:2px 10px;letter-spacing:.04em}
.ai-timestamp{font-size:10px;color:var(--dim)}
.ai-regen-btn{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:10px;font-family:inherit;border-radius:6px;padding:3px 9px;transition:.15s}
.ai-regen-btn:hover{color:var(--text);border-color:var(--purple)}
/* Modal */
.ai-key-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.ai-key-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 30px;width:480px;max-width:92vw}
.ai-key-box h3{font-size:15px;font-weight:900;margin-bottom:6px}
.ai-key-box p{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.7}
.ai-key-input{width:100%;background:#0a0c12;border:1px solid var(--border);color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;font-family:monospace;outline:none;letter-spacing:.04em}
.ai-key-input:focus{border-color:var(--purple)}
.ai-key-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.ai-key-note{font-size:10px;color:var(--dim);margin-top:10px;line-height:1.5}
</style>
</head>

const SUPA_URL = 'https://akpuifenfstvobwtqtcq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrcHVpZmVuZnN0dm9id3RxdGNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDMxOTAsImV4cCI6MjEwMjM3OTE5MH0.5397pVE5XlyV2864iTf96Ttj--HqoffovzJ9Z9mI0ig';
const _sbc = supabase.createClient(SUPA_URL, SUPA_KEY);

let currentClienteId = null;
let currentClienteColor = '#7B2FBE';
let allRuns = [];
let allResults = [];
let deviceOrderMap = {}; // nombre → orden (from checklist_devices)
let activeDays = 90;
let activeTab = 'resumen';

let selectedDevice = null;        // Nivel 2 device drilldown
let currentDecisionContext = null; // Populated by buildDecision() for AI analysis

const chartInstances = {};

// ── Platform inference ──
function inferPlataforma(dispositivo) {
  if (!dispositivo) return 'Otro';
  const d = dispositivo.toLowerCase();
  if (d.includes('ipad') || d.includes('iphone')) return 'iOS';
  if (d.includes('android tv') || (d.includes('tv') && d.includes('sony'))) return 'Android TV';
  if (d.includes('samsung tv') || d.includes('hisense') || d.includes('lg tv')) return 'Smart TV';
  if (d.includes('android') || d.includes('galaxy')) return 'Android';
  if (d === 'web' || d.includes('web')) return 'Web';
  if (d.includes('roku')) return 'Streaming';
  return 'Otro';
}

// ── Data loading ──
async function supaFetch(path) {
  const r = await fetch(SUPA_URL + path, {
    headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadAll() {
  const clienteFilter = currentClienteId ? `&cliente_id=eq.${currentClienteId}` : '';

  // Load device order from checklist_devices
  try {
    const devs = await supaFetch(`/rest/v1/checklist_devices?select=nombre,orden${clienteFilter}&order=orden.asc`);
    deviceOrderMap = {};
    (devs || []).forEach((d, i) => { deviceOrderMap[d.nombre] = d.orden ?? i; });
  } catch(_) {}

  allRuns = await supaFetch(`/rest/v1/checklist_runs?select=*&order=fecha.asc,hora_franja.asc${clienteFilter}`);
  if (!allRuns.length) { allResults = []; return; }

  const runIds = allRuns.map(r => r.id);
  const PAGE = 1000;
  const BATCH = 50;

  async function fetchBatch(ids) {
    const rows = [];
    let offset = 0;
    while (true) {
      const chunk = await supaFetch(
        `/rest/v1/checklist_results?select=run_id,dispositivo,numero_item,nombre_item,seccion,estado&run_id=in.(${ids})&order=id&limit=${PAGE}&offset=${offset}`
      );
      rows.push(...(chunk || []));
      if (!chunk || chunk.length < PAGE) break;
      offset += PAGE;
    }
    return rows;
  }

  const batches = [];
  for (let i = 0; i < runIds.length; i += BATCH) {
    batches.push(runIds.slice(i, i + BATCH).join(','));
  }
  const batchResults = await Promise.all(batches.map(ids => fetchBatch(ids)));
  allResults = batchResults.flat();
}

// ── Dedup ──
function dedup(results) {
  const priority = { 'FAIL':3, 'UNABLE TO TEST':2, 'N/A':1, 'PASS':0 };
  const map = new Map();
  for (const r of results) {
    const key = `${r.run_id}|${r.numero_item}|${r.dispositivo}`;
    const cur = map.get(key);
    if (!cur || (priority[r.estado]??-1) > (priority[cur.estado]??-1)) map.set(key, r);
  }
  return [...map.values()];
}

function filteredRuns() {
  const tipoSel   = document.getElementById('an-tipo')?.value || '';
  const franjaSel = document.getElementById('an-franja')?.value || '';
  return allRuns.filter(r => {
    if (activeDays) {
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - activeDays);
      if ((r.fecha || '') < cutoff.toISOString().slice(0,10)) return false;
    }
    if (tipoSel   && r.tipo        !== tipoSel)   return false;
    if (franjaSel && r.hora_franja !== franjaSel) return false;
    return true;
  });
}

function periodLabel() {
  if (!activeDays) return 'Todo el historial';
  if (activeDays === 7)  return 'Últimos 7 días';
  if (activeDays === 28) return 'Últimas 4 semanas';
  if (activeDays === 90) return 'Últimos 90 días';
  return `Últimos ${activeDays} días`;
}

// ── Main render ──
function renderPage() {
  const runs = filteredRuns();
  const lbl = periodLabel();
  const lblEl = document.getElementById('periodLabel');
  if (lblEl) lblEl.textContent = lbl;

  if (!runs.length) {
    document.getElementById('mainContent').innerHTML =
      '<div class="empty-msg">No hay runs en el período seleccionado.</div>';
    return;
  }

  const runSet = new Set(runs.map(r => r.id));
  const results = dedup(allResults.filter(r => runSet.has(r.run_id)));

  // ── Core aggregates ──
  const totalRuns    = runs.length;
  const totalChecks  = results.length;
  const passCount    = results.filter(r => r.estado === 'PASS').length;
  const failCount    = results.filter(r => r.estado === 'FAIL').length;
  const naCount      = results.filter(r => r.estado === 'N/A').length;
  const uttCount     = results.filter(r => r.estado === 'UNABLE TO TEST').length;
  // Denominadores diferenciados (FASE 1.1)
  const evalCount    = passCount + failCount;   // checks evaluables: solo PASS + FAIL (excluye N/A y UTT)
  const failPct      = totalChecks ? Math.round(failCount / totalChecks * 100) : 0;   // tasa sobre TODOS los checks
  const failPctEval  = evalCount   ? Math.round(failCount / evalCount   * 100) : 0;   // tasa sobre checks EVALUABLES
  const passPct      = totalChecks ? Math.round(passCount / totalChecks * 100) : 0;
  const passPctEval  = evalCount   ? Math.round(passCount / evalCount   * 100) : 0;   // tasa sobre checks EVALUABLES

  const allDevices    = [...new Set(results.map(r => r.dispositivo).filter(Boolean))];
  const allItems      = [...new Set(results.map(r => r.nombre_item || r.numero_item).filter(Boolean))];
  const devsWithFail  = allDevices.filter(dev => results.some(r => r.dispositivo === dev && r.estado === 'FAIL'));

  // Per-run stats (for trend chart)
  const runStats = runs.map(run => {
    const rr = results.filter(r => r.run_id === run.id);
    const p = rr.filter(r => r.estado === 'PASS').length;
    const f = rr.filter(r => r.estado === 'FAIL').length;
    const total = rr.length;
    return {
      label: (run.fecha||'').slice(5) + ' ' + (run.hora_franja||'').slice(0,5),
      operador: run.operador,
      passRate: total ? Math.round(p/total*100) : null,
      pass: p, fail: f, total
    };
  }).filter(r => r.total > 0);

  // Per-device stats
  const deviceStats = allDevices.map(dev => {
    const rr = results.filter(r => r.dispositivo === dev);
    const f  = rr.filter(r => r.estado === 'FAIL').length;
    const p  = rr.filter(r => r.estado === 'PASS').length;
    const ev = p + f; // checks evaluables del dispositivo (excluye N/A y UTT)
    return {
      dev,
      failCount: f,
      passCount: p,
      evalChecks: ev,                                                          // checks evaluables
      total: rr.length,                                                        // todos los checks (incl. N/A y UTT)
      failPct:     rr.length ? Math.round(f/rr.length*100) : 0,              // tasa sobre todos
      failPctEval: ev        ? Math.round(f/ev*100)        : 0,              // tasa sobre evaluables (PASS+FAIL)
      platform: inferPlataforma(dev)
    };
  }).sort((a,b) => b.failCount - a.failCount)
  .map(d => ({ ...d, pctOfFails: failCount ? Math.round(d.failCount/failCount*100) : 0 }));

  // Per-platform stats
  const platformMap = new Map();
  for (const r of results) {
    if (r.estado !== 'FAIL') continue;
    const p = inferPlataforma(r.dispositivo);
    platformMap.set(p, (platformMap.get(p)||0) + 1);
  }
  const platformStats = [...platformMap.entries()]
    .map(([p, f]) => ({ platform: p, failCount: f, pctOfFails: failCount ? Math.round(f/failCount*100) : 0 }))
    .sort((a,b) => b.failCount - a.failCount);

  // Per-item stats (absolute FAILs + % of total FAILs + fail rate)
  const itemMap = new Map();
  for (const r of results) {
    const key = r.nombre_item || r.numero_item;
    if (!key) continue;
    if (!itemMap.has(key)) itemMap.set(key, { name: key, pass:0, fail:0, total:0, byPlatform:{}, byDevice:{}, byDevicePass:{} });
    const it = itemMap.get(key);
    it.total++;
    if (r.estado === 'PASS') {
      it.pass++;
      if (r.dispositivo) it.byDevicePass[r.dispositivo] = (it.byDevicePass[r.dispositivo]||0) + 1;
    }
    if (r.estado === 'FAIL') {
      it.fail++;
      const plat = inferPlataforma(r.dispositivo);
      it.byPlatform[plat] = (it.byPlatform[plat]||0) + 1;
      if (r.dispositivo) {
        it.byDevice[r.dispositivo] = (it.byDevice[r.dispositivo]||0) + 1;
      }
    }
  }
  const itemStats = [...itemMap.values()]
    .map(it => {
      const evalIt = it.pass + it.fail; // checks evaluables del ítem
      return {
        ...it,
        evalChecks: evalIt,                                                              // checks evaluables del ítem
        failRate:     evalIt    ? Math.round(it.fail/evalIt*100)    : 0,               // tasa sobre evaluables (PASS+FAIL)
        failRateAll:  it.total  ? Math.round(it.fail/it.total*100)  : 0,              // tasa sobre todos (incl. N/A y UTT)
        pctOfFails:   failCount ? Math.round(it.fail/failCount*100) : 0,
        topPlatform: Object.entries(it.byPlatform).sort((a,b)=>b[1]-a[1])[0] || null,
        topDevice:   Object.entries(it.byDevice||{}).sort((a,b)=>b[1]-a[1])[0] || null
      };
    })
    .filter(it => it.total >= 3)
    .sort((a,b) => b.fail - a.fail); // sorted by absolute count

  // Per-operator
  const opMap = new Map();
  for (const run of runs) {
    const op = run.operador || 'Sin nombre';
    opMap.set(op, (opMap.get(op)||0)+1);
  }
  const opStats = [...opMap.entries()].sort((a,b)=>b[1]-a[1]);

  const worstDevice = deviceStats[0];
  const worstItem   = itemStats[0];

  // ── Build HTML by active tab ──
  let html = '';

  if (activeTab === 'resumen') {
    html = buildResumen({ totalRuns, totalChecks, evalCount, passCount, failCount, naCount, uttCount,
      failPct, failPctEval, passPct, passPctEval,
      allDevices, allItems, devsWithFail, worstDevice, worstItem,
      runStats, opStats, platformStats });
  } else if (activeTab === 'incidencias') {
    html = buildIncidencias({ results, deviceStats, itemStats, platformStats, failCount, totalChecks, evalCount });
  } else if (activeTab === 'decision') {
    html = buildDecision({ itemStats, failCount, totalChecks, evalCount, lbl, results });
  } else if (activeTab === 'versiones') {
    html = buildVersiones(runs, results);
  }

  document.getElementById('mainContent').innerHTML = html;
  requestAnimationFrame(() => mountCharts(activeTab, { results, runs, runSet, runStats, deviceStats, itemStats, platformStats, opStats, passCount, failCount, naCount, uttCount }));
}

          ${selectedDevice ? `<span style="color:var(--purple);font-weight:400"> — ${escHtml(selectedDevice)}</span>` : ''}
        </div>
        <span style="font-size:10px;color:var(--muted)">${pctLabel}</span>
      </div>
      <div class="chart-desc" style="margin-bottom:14px">
        ${selectedDevice
          ? `Ítems con más FAILs registrados en <strong style="color:#fff">${escHtml(selectedDevice)}</strong> · ${drillFailTotal} FAILs totales en este dispositivo`
          : 'Ordenados por cantidad absoluta de FAILs registrados en el período'}
      </div>
      ${drillItems.length ? `
        <div class="prop-list">
          ${drillItems.map(it => `
            <div class="prop-item">
              <div class="prop-item-header">
                <span class="prop-item-name" title="${escHtml(it.name)}">${escHtml(truncate(it.name, 52))}</span>
                <span class="prop-item-vals">${it.fail} FAILs · <strong style="color:#e34948">${it.pctOfFails}%</strong></span>
              </div>
              <div class="prop-bar-track">
                <div class="prop-bar-fill prop-bar-fail" style="width:${Math.round(it.fail/maxFail*100)}%"></div>
              </div>
            </div>
          `).join('')}
        </div>
      ` : '<div class="empty-msg">Sin ítems con FAIL para este dispositivo</div>'}
    </div>
  `;
}

function clearDevice() {
  selectedDevice = null;
  renderPage();
}

// ─────────────────────────────────────────────────────
// NIVEL 3 — DECISIÓN
// ─────────────────────────────────────────────────────
function buildDecision({ itemStats, failCount, totalChecks, evalCount, lbl, results }) {
  const itemsWithFails = itemStats.filter(it => it.fail > 0);
  const opts = itemsWithFails.map(it =>
    `<option value="${escHtml(it.name)}" ${selectedDecisionItem === it.name ? 'selected' : ''}>${escHtml(truncate(it.name, 60))} (${it.fail} FAILs registrados)</option>`
  ).join('');

  const sel = selectedDecisionItem ? itemStats.find(it => it.name === selectedDecisionItem) : null;

  let insightHtml = `
    <div class="empty-decision">
      <span>⚡</span>
      Selecciona una funcionalidad para generar el análisis de decisión
    </div>`;

  if (sel) {
    const pct = sel.pctOfFails;
    const rate = sel.failRate;
    // Use device-level breakdown (not platform grouping)
    const topDevice = sel.topDevice ? sel.topDevice[0] : null;
    const topDeviceCount = sel.topDevice ? sel.topDevice[1] : 0;
    const topDevicePct = sel.fail ? Math.round(topDeviceCount / sel.fail * 100) : 0;

    // Clasificación por concentración de FAILs (umbral provisional, no equivale a prioridad de negocio)
    let priority = 'low', priorityLabel = '🟢 Concentración baja', priorityClass = 'priority-low';
    if (pct >= 20) { priority = 'high'; priorityLabel = '🔴 Alta concentración de FAILs'; priorityClass = 'priority-high'; }
    else if (pct >= 10) { priority = 'medium'; priorityLabel = '🟡 Concentración media de FAILs'; priorityClass = 'priority-medium'; }

    // Concentration
    const concentrated = topDevice && topDevicePct >= 60;

    // Narrative text (FAILs registrados, no "incidencias")
    let narrative = `<strong>${escHtml(sel.name)}</strong> acumuló <strong>${sel.fail} FAILs registrados</strong> durante ${escHtml(lbl.toLowerCase())}, representando el <strong>${pct}% del total de FAILs</strong> del período. Tasa de fallo: <strong>${rate}%</strong> sobre ${sel.evalChecks} checks evaluables (PASS+FAIL).`;

    if (concentrated && topDevice) {
      narrative += ` El <strong>${topDevicePct}%</strong> de estos FAILs se concentra en <strong>${escHtml(topDevice)}</strong> (${topDeviceCount} FAILs).`;
    } else if (topDevice) {
      narrative += ` El dispositivo con mayor concentración es <strong>${escHtml(topDevice)}</strong> con ${topDeviceCount} FAILs (${topDevicePct}% de los FAILs de este ítem).`;
    }

    // Recomendación operativa (sin afirmar prioridad de negocio)
    let recommendation = '';
    if (priority === 'high' && concentrated && topDevice) {
      recommendation = `Se recomienda revisar el comportamiento de <em>${escHtml(sel.name)}</em> en <strong>${escHtml(topDevice)}</strong>: concentración atípica (&gt;60% de los FAILs en un solo dispositivo) con alta participación en el total. <em>Nota: esta clasificación es provisional y está basada en frecuencia de FAILs, no en severidad ni impacto de negocio.</em>`;
    } else if (priority === 'high') {
      recommendation = `Este ítem supera el umbral del 20% de concentración de FAILs en el período — puede requerir revisión. <em>Nota: esta clasificación es provisional y basada únicamente en frecuencia de FAILs registrados.</em>`;
    } else if (priority === 'medium') {
      recommendation = `Monitorear en los próximos runs — supera el umbral del 10% de FAILs globales. <em>Nota: clasificación provisional por concentración.</em>`;
    } else {
      recommendation = `Baja concentración de FAILs en el período. Continuar seguimiento normal.`;
    }

    // Store context for AI analysis (read by generateAIAnalysis())
    currentDecisionContext = {
      itemName: sel.name,
      fail: sel.fail,
      pct,
      rate,
      evalChecks: sel.evalChecks,
      totalFailCount: failCount,
      topDevice,
      topDeviceCount,
      topDevicePct,
      priority,
      lbl,
      devStats: Object.entries(sel.byDevice||{})
        .sort((a,b) => b[1]-a[1]).slice(0, 7)
        .map(([dev, f]) => {
          const p = (sel.byDevicePass||{})[dev] || 0;
          const ev = f + p;
          return { dev, fails: f, rate: ev ? Math.round(f/ev*100) : 0, pct: sel.fail ? Math.round(f/sel.fail*100) : 0 };
        })
    };

    // Device breakdown for this item — with full evaluable context (FASE 2.5)
    const devBreakdown = Object.entries(sel.byDevice||{})
      .sort((a,b) => b[1]-a[1])
      .slice(0, 8)
      .map(([dev, failsInDev]) => {
        const passInDev    = (sel.byDevicePass||{})[dev] || 0;
        const evalInDev    = failsInDev + passInDev;          // checks evaluables (PASS+FAIL) en este dispositivo para este ítem
        const rateInDev    = evalInDev ? Math.round(failsInDev/evalInDev*100) : 0;
        const pctOfItem    = sel.fail   ? Math.round(failsInDev/sel.fail*100)  : 0;
        return `<div style="display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border2)">
          <span style="font-size:12px;color:var(--text);font-weight:600">${escHtml(dev)}</span>
          <div style="text-align:right;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:12px;color:#e34948;font-weight:700">${failsInDev} FAILs · ${pctOfItem}% del ítem</span>
            <span style="font-size:10px;color:var(--muted)">${evalInDev} checks eval. · tasa ${rateInDev}%</span>
          </div>
        </div>`;
      }).join('');

    insightHtml = `
      <div class="priority-badge ${priorityClass}">${priorityLabel}</div>

      <div class="decision-kpi-row">
        <div class="d-kpi">
          <div class="d-kpi-val" style="color:#e34948">${sel.fail}</div>
          <div class="d-kpi-label">FAILs registrados</div>
          <div class="d-kpi-sub">en el período</div>
        </div>
        <div class="d-kpi">
          <div class="d-kpi-val" style="color:#f59e0b">${pct}<span style="font-size:14px">%</span></div>
          <div class="d-kpi-label">Del total de FAILs</div>
          <div class="d-kpi-sub">de ${failCount} FAILs globales</div>
        </div>
        <div class="d-kpi">
          <div class="d-kpi-val" style="color:#7c82a0">${rate}<span style="font-size:14px">%</span></div>
          <div class="d-kpi-label">Tasa de fallo</div>
          <div class="d-kpi-sub">sobre ${sel.evalChecks} checks eval. (PASS+FAIL)</div>
        </div>
      </div>

      <div class="narrative-box">
        <div class="narrative-period">${escHtml(lbl)}</div>
        <div class="narrative-text">${narrative}</div>
      </div>

      <!-- Tendencia de FAILs por run (FASE 2.6) -->
      <div class="chart-card" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px">
          <div class="chart-title">Tendencia de FAILs registrados por run</div>
          <span id="trendSummaryBadge" style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px"></span>
        </div>
        <div class="chart-desc">Evolución de los FAILs de este ítem en los runs del período (últimos 20 runs con datos)</div>
        <div class="chart-wrap" style="height:160px"><canvas id="chartItemTrend"></canvas></div>
        <div class="footnote">Cada barra es un run · runs donde el ítem no fue evaluado son excluidos</div>
      </div>

      <div class="chart-card" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
          <div class="chart-title">Recomendación</div>
          <button class="ai-analyze-btn" id="aiBtn" onclick="generateAIAnalysis()">✨ Analizar con IA</button>
        </div>
        <div id="aiResult" style="font-size:13px;color:var(--text);line-height:1.8">${recommendation}</div>
      </div>

      ${devBreakdown ? `
        <div class="chart-card">
          <div class="chart-title">FAILs por dispositivo — ${escHtml(truncate(sel.name, 40))}</div>
          <div class="chart-desc" style="margin-bottom:8px">Distribución de los ${sel.fail} FAILs registrados por dispositivo</div>
          ${devBreakdown}
        </div>
      ` : ''}
    `;
  }

  return `
    <div class="section-heading">
      <div class="section-num">3</div>
      <div class="section-title">¿Qué deberíamos hacer?</div>
      <div class="section-desc">Dato → análisis → decisión</div>
    </div>

    <div class="decision-panel">
      <h3>Análisis de funcionalidad</h3>
      <p>Selecciona un ítem para ver sus FAILs registrados, concentración relativa y orientación operativa. Los umbrales de clasificación son provisionales y están basados en frecuencia, no en severidad de negocio.</p>
      <div class="decision-select-row">
        <select class="decision-select" id="decisionItemSelect" onchange="onDecisionItemChange(this.value)">
          <option value="">— Selecciona una funcionalidad —</option>
          ${opts}
        </select>
      </div>
      ${insightHtml}
    </div>
  `;
}

function onDecisionItemChange(val) {
  selectedDecisionItem = val || null;
  renderPage();
}

// ─────────────────────────────────────────────────────
// AI ANALYSIS — Claude API integration
// ─────────────────────────────────────────────────────
function getAnthropicKey() {
  try { return localStorage.getItem('ms_anthropic_key') || ''; } catch(e) { return ''; }
}

function showKeyModal(cb) {
  const existing = getAnthropicKey();
  const modal = document.createElement('div');
  modal.className = 'ai-key-modal';
  modal.id = 'aiKeyModal';
  modal.innerHTML = `
    <div class="ai-key-box">
      <h3>🔑 Clave de API Anthropic</h3>
      <p>Para usar el análisis IA, ingresa tu API Key de Anthropic (comienza con <code style="color:#c3a0ff">sk-ant-</code>). La clave se guarda únicamente en <strong>este navegador</strong> (localStorage) y no se envía a ningún servidor de Mediastream.</p>
      <input class="ai-key-input" id="aiKeyInput" type="password" placeholder="sk-ant-api03-..." value="${existing}" autocomplete="off">
      <p class="ai-key-note">Puedes obtener tu clave en <a href="https://console.anthropic.com/settings/keys" target="_blank" style="color:var(--purple)">console.anthropic.com</a>. El análisis usa Claude Haiku (costo mínimo por consulta).</p>
      <div class="ai-key-actions">
        <button class="filter-btn" onclick="document.getElementById('aiKeyModal').remove()">Cancelar</button>
        <button class="ai-analyze-btn" onclick="
          const k = document.getElementById('aiKeyInput').value.trim();
          if (!k) return;
          try { localStorage.setItem('ms_anthropic_key', k); } catch(e){}
          document.getElementById('aiKeyModal').remove();
          if (window.__aiKeyCb) { window.__aiKeyCb(k); window.__aiKeyCb = null; }
        ">✓ Guardar y analizar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  window.__aiKeyCb = cb;
  setTimeout(() => { const inp = document.getElementById('aiKeyInput'); if(inp) inp.focus(); }, 50);
}

async function generateAIAnalysis() {
  const ctx = currentDecisionContext;
  if (!ctx) return;

  let key = getAnthropicKey();
  if (!key) {
    showKeyModal(k => { if (k) generateAIAnalysis(); });
    return;
  }

  const btn = document.getElementById('aiBtn');
  const resultDiv = document.getElementById('aiResult');
  if (!btn || !resultDiv) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="ai-spinner"></span>Analizando...';
  resultDiv.innerHTML = '<div style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;padding:4px 0"><div class="ai-spinner" style="border-top-color:var(--purple)"></div>Claude está analizando los datos del período...</div>';

  // Build the prompt
  const devLines = ctx.devStats.map(d =>
    `  · ${d.dev}: ${d.fails} FAILs (${d.pct}% del ítem · tasa ${d.rate}%)`
  ).join('\n');

  const concentrated = ctx.topDevice && ctx.topDevicePct >= 55;

  const prompt = `Eres analista senior de calidad QA de una plataforma OTT streaming latinoamericana. Analiza estos datos y entrega una recomendación operativa concisa en español profesional.

FUNCIONALIDAD ANALIZADA: "${ctx.itemName}"
PERÍODO: ${ctx.lbl}
Checks evaluables (PASS+FAIL): ${ctx.evalChecks}
FAILs registrados: ${ctx.fail} — representa el ${ctx.pct}% de los ${ctx.totalFailCount} FAILs globales del período
Tasa de fallo: ${ctx.rate}% (sobre checks evaluables, excluye N/A y UTT)
Nivel de concentración: ${ctx.priority === 'high' ? 'ALTA (>20% del total de FAILs)' : ctx.priority === 'medium' ? 'MEDIA (10–20%)' : 'BAJA (<10%)'}
${ctx.topDevice ? `Dispositivo más afectado: ${ctx.topDevice} (${ctx.topDevicePct}% de los FAILs de esta funcionalidad)` : ''}
${concentrated ? '→ Concentración atípica: +55% de FAILs en un solo dispositivo' : '→ FAILs distribuidos entre varios dispositivos'}

Distribución por dispositivo:
${devLines}

CONTEXTO: La plataforma se prueba en 8 franjas horarias diarias con un equipo de 3–4 operadores. Los FAILs registrados corresponden a ejecuciones reales de checklist, no a tickets Jira. Una "Alta concentración" significa que este ítem falló con frecuencia relativa alta pero no implica necesariamente severidad crítica.

Escribe exactamente 3 párrafos:
1. DIAGNÓSTICO: ¿el fallo es específico de uno o varios dispositivos? ¿Qué sugiere el patrón de distribución?
2. ACCIÓN: qué debería hacer el equipo QA esta semana (puede incluir: escalar al cliente, abrir ticket, aumentar frecuencia de monitoreo, investigar versión específica)
3. CONTEXTO OTT: si este tipo de fallo en esta funcionalidad es esperable o atípico en plataformas OTT

Usa los números reales, no los parafrasees. Sé directo. Máximo 220 palabras en total.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-allow-browser': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5',
        max_tokens: 500,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!resp.ok) {
      let errMsg = `Error HTTP ${resp.status}`;
      try { const e = await resp.json(); errMsg = e.error?.message || errMsg; } catch(e){}
      if (resp.status === 401) {
        try { localStorage.removeItem('ms_anthropic_key'); } catch(e){}
        resultDiv.innerHTML = `<span style="color:#f87171">❌ API Key inválida o expirada.</span> <button class="ai-analyze-btn" style="margin-top:8px" onclick="generateAIAnalysis()">↻ Ingresar clave correcta</button>`;
      } else {
        resultDiv.innerHTML = `<span style="color:#f87171">❌ ${errMsg}</span>`;
      }
      btn.disabled = false;
      btn.innerHTML = '✨ Analizar con IA';
      return;
    }

    const data = await resp.json();
    const text = (data.content?.[0]?.text || '').trim();
    if (!text) { resultDiv.innerHTML = '<span style="color:#f87171">❌ Respuesta vacía de la API</span>'; btn.disabled = false; btn.innerHTML = '✨ Analizar con IA'; return; }

    // Render paragraphs
    const paras = text.split(/\n{2,}/).filter(Boolean)
      .map(p => `<p style="margin-bottom:10px;font-size:13px;line-height:1.8">${p.replace(/\n/g,'<br>')}</p>`)
      .join('');

    const now = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
    resultDiv.innerHTML = `
      <div class="ai-result-header">
        <span class="ai-badge">✨ ANÁLISIS IA</span>
        <span class="ai-timestamp">Claude Haiku · ${now}</span>
        <button class="ai-regen-btn" onclick="generateAIAnalysis()">↻ Regenerar</button>
      </div>
      ${paras}
    `;
    btn.innerHTML = '✨ Regenerar análisis';
    btn.disabled = false;

  } catch(e) {
    resultDiv.innerHTML = `<span style="color:#f87171">❌ Error de red: ${e.message}. Verifica que estás conectado.</span>`;
    btn.disabled = false;
    btn.innerHTML = '✨ Analizar con IA';
  }
}

// ─────────────────────────────────────────────────────
// Mount charts after HTML render
// ─────────────────────────────────────────────────────
function mountCharts(tab, { results, runs, runSet, runStats, deviceStats, itemStats, platformStats, opStats, passCount, failCount, naCount, uttCount }) {

  if (tab === 'resumen') {
    // Trend
    mkChart('chartTrend', {
      type: 'line',
      data: {
        labels: runStats.map(r => r.label),
        datasets: [{
          data: runStats.map(r => r.passRate),
          borderColor: '#97D700',
          backgroundColor: 'rgba(151,215,0,0.10)',
          borderWidth: 2,
          pointRadius: runStats.length <= 30 ? 4 : 2,
          pointHoverRadius: 6,
          pointBackgroundColor: '#97D700',
          fill: true,
          tension: 0.3,
          spanGaps: true,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y}% PASS`, title: ctx => ctx[0].label } }
        },
        scales: {
          x: { grid: { color: gridColor }, ticks: { maxTicksLimit: 12, maxRotation: 35 } },
          y: { min: 0, max: 100, grid: { color: gridColor }, ticks: { callback: v => v+'%', stepSize: 20 } }
        }
      }
    });

    // Status donut
    mkChart('chartStatus', {
      type: 'doughnut',
      data: {
        labels: ['PASS', 'FAIL', 'N/A', 'UNABLE TO TEST'],
        datasets: [{
          data: [passCount, failCount, naCount, uttCount],
          backgroundColor: ['#1baf7a','#e34948','#898781','#eda100'],
          borderColor: surface,
          borderWidth: 2,
          hoverOffset: 6,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        cutout: '62%',
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, padding: 14, font: { size: 11 } } },
          tooltip: { callbacks: { label: ctx => {
            const v = ctx.parsed;
            const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
            return ` ${ctx.label}: ${v} (${Math.round(v/total*100)}%)`;
          }}}
        }
      }
    });

    // Operators
    mkChart('chartOps', {
      type: 'bar',
      data: {
        labels: opStats.map(o => o[0]),
        datasets: [{
          data: opStats.map(o => o[1]),
          backgroundColor: 'rgba(142,101,216,0.80)',
          borderColor: '#8E65D8',
          borderWidth: 1,
          borderRadius: 4,
          borderSkipped: 'bottom',
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y} runs` } } },
        scales: { x: { grid: { display: false } }, y: { grid: { color: gridColor }, ticks: { stepSize: 1 } } }
      }
    });
  }

  if (tab === 'incidencias') {
    // Devices horizontal bar (% fail) — CLICKABLE drilldown
    const devBgColors = deviceStats.map(d => {
      if (selectedDevice) return d.dev === selectedDevice ? '#8E65D8' : 'rgba(142,101,216,0.25)';
      return d.failPct >= 20 ? 'rgba(227,73,72,0.85)' : 'rgba(227,73,72,0.55)';
    });
    const devBorderColors = deviceStats.map(d => {
      if (selectedDevice) return d.dev === selectedDevice ? '#8E65D8' : 'rgba(142,101,216,0.25)';
      return '#e34948';
    });

    const maxDevFail = Math.max(...deviceStats.map(d => d.failCount), 1);
    const devChart = mkChart('chartDevices', {
      type: 'bar',
      data: {
        labels: deviceStats.map(d => d.dev),
        datasets: [{
          data: deviceStats.map(d => d.failCount),
          backgroundColor: devBgColors,
          borderColor: devBorderColors,
          borderWidth: 1,
          borderRadius: 4,
          borderSkipped: 'left',
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: {
            label: ctx => ` ${ctx.parsed.x} FAILs · ${deviceStats[ctx.dataIndex].failPct}% tasa de fallo (${deviceStats[ctx.dataIndex].pctOfFails}% del total)`
          }}
        },
        scales: {
          x: { min: 0, max: maxDevFail, grid: { color: gridColor }, ticks: { stepSize: Math.ceil(maxDevFail/5) } },
          y: { grid: { display: false }, ticks: { font: { size: 10 } } }
        }
      }
    });

    // Click handler — toggle drilldown
    const devCanvas = document.getElementById('chartDevices');
    if (devCanvas && devChart) {
      devCanvas.onclick = function(evt) {
        const pts = devChart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true);
        if (!pts.length) return;
        const dev = deviceStats[pts[0].index].dev;
        selectedDevice = (selectedDevice === dev) ? null : dev;
        renderPage();
      };
    }
  }

  // ── NIVEL 3 — Tendencia de FAILs por ítem (FASE 2.6) ──
  if (tab === 'decision' && selectedDecisionItem && document.getElementById('chartItemTrend')) {
    // Deduplicar solo los resultados del ítem seleccionado por run
    const itemRawResults = allResults.filter(r =>
      runSet.has(r.run_id) &&
      (r.nombre_item === selectedDecisionItem || r.numero_item === selectedDecisionItem)
    );
    const itemDedupMap = new Map();
    const priority = { 'FAIL':3, 'UNABLE TO TEST':2, 'N/A':1, 'PASS':0 };
    for (const r of itemRawResults) {
      const key = `${r.run_id}|${r.dispositivo}`;
      const cur = itemDedupMap.get(key);
      if (!cur || (priority[r.estado]??-1) > (priority[cur.estado]??-1)) itemDedupMap.set(key, r);
    }
    const itemDeduped = [...itemDedupMap.values()];

    // Calcular FAILs por run (solo runs donde el ítem fue evaluado = tiene PASS o FAIL)
    const trendPoints = runs.map(run => {
      const rr = itemDeduped.filter(r => r.run_id === run.id);
      const f  = rr.filter(r => r.estado === 'FAIL').length;
      const p  = rr.filter(r => r.estado === 'PASS').length;
      return { label: (run.fecha||'').slice(5)+' '+(run.hora_franja||'').slice(0,5), fails: f, pass: p, tested: f+p };
    }).filter(r => r.tested > 0).slice(-20); // últimos 20 runs con datos del ítem

    // Tendencia: comparar primera mitad vs segunda mitad
    let trendText = '', trendColor = '#7c82a0', trendBg = 'rgba(124,130,160,0.12)';
    if (trendPoints.length >= 10) {
      // Últimos 5 vs 5 anteriores — más sensible a cambio reciente
      const prev5 = trendPoints.slice(-10, -5);
      const last5 = trendPoints.slice(-5);
      const avg = arr => arr.reduce((s,r) => s + (r.total ? r.fails/r.total*100 : 0), 0) / arr.length;
      const avgPrev = avg(prev5);
      const avgLast = avg(last5);
      const pctChange = avgPrev > 0 ? (avgLast - avgPrev) / avgPrev * 100 : 0;
      if (pctChange > 15) {
        trendText = '📈 En aumento'; trendColor = '#f87171'; trendBg = 'rgba(227,73,72,0.12)';
      } else if (pctChange < -15) {
        trendText = '📉 En descenso'; trendColor = '#34d399'; trendBg = 'rgba(27,175,122,0.12)';
      } else {
        trendText = '➡️ Estable'; trendColor = '#fbbf24'; trendBg = 'rgba(237,161,0,0.12)';
      }
    } else if (trendPoints.length >= 4) {
      const half = Math.floor(trendPoints.length / 2);
      const avg = arr => arr.reduce((s,r) => s + (r.total ? r.fails/r.total*100 : 0), 0) / arr.length;
      const delta = avg(trendPoints.slice(-half)) - avg(trendPoints.slice(0, half));
      if (delta > 2) {
        trendText = '📈 En aumento'; trendColor = '#f87171'; trendBg = 'rgba(227,73,72,0.12)';
      } else if (delta < -2) {
        trendText = '📉 En descenso'; trendColor = '#34d399'; trendBg = 'rgba(27,175,122,0.12)';
      } else {
        trendText = '➡️ Estable'; trendColor = '#fbbf24'; trendBg = 'rgba(237,161,0,0.12)';
      }
    } else if (trendPoints.length > 0) {
      trendText = 'Pocos datos';
    }

    const badge = document.getElementById('trendSummaryBadge');
    if (badge && trendText) {
      badge.textContent = trendText;
      badge.style.color = trendColor;
      badge.style.background = trendBg;
      badge.style.border = `1px solid ${trendColor}44`;
    }

    // Color bars: rojo si supera el promedio, morado si igual, verde si bajo
    const avgFails = trendPoints.length ? trendPoints.reduce((s,r) => s+r.fails, 0) / trendPoints.length : 0;
    const barColors = trendPoints.map(r =>
      r.fails > avgFails * 1.2 ? 'rgba(227,73,72,0.85)' :
      r.fails < avgFails * 0.8 ? 'rgba(27,175,122,0.70)' :
      'rgba(142,101,216,0.70)'
    );

    mkChart('chartItemTrend', {
      type: 'bar',
      data: {
        labels: trendPoints.map(r => r.label),
        datasets: [{
          data: trendPoints.map(r => r.fails),
          backgroundColor: barColors,
          borderColor: barColors.map(c => c.replace('0.85','1').replace('0.70','1')),
          borderWidth: 1,
          borderRadius: 3,
          borderSkipped: 'bottom',
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: {
            label: ctx => ` ${ctx.parsed.y} FAILs · ${trendPoints[ctx.dataIndex].pass} PASS`
          }}
        },
        scales: {
          x: { grid: { display: false }, ticks: { maxRotation: 40, font: { size: 9 }, maxTicksLimit: 15 } },
          y: { min: 0, grid: { color: gridColor }, ticks: { stepSize: 1 } }
        }
      }
    });
  }
}

// ─────────────────────────────────────────────────────
// REPORTE PDF — EXPORTAR
// ─────────────────────────────────────────────────────
function generateReport() {
  const runs  = filteredRuns();
  const lbl   = periodLabel();
  if (!runs.length) { alert('No hay datos en el período seleccionado.'); return; }

  const runSet     = new Set(runs.map(r => r.id));
  const results    = dedup(allResults.filter(r => runSet.has(r.run_id)));
  const totalRuns  = runs.length;
  const totalChecks = results.length;
  const passCount  = results.filter(r => r.estado === 'PASS').length;
  const failCount  = results.filter(r => r.estado === 'FAIL').length;
  const naCount    = results.filter(r => r.estado === 'N/A').length;
  const uttCount   = results.filter(r => r.estado === 'UNABLE TO TEST').length;
  const evalCount  = passCount + failCount;
  const failPctEval = evalCount ? Math.round(failCount / evalCount * 100) : 0;
  const passPctEval = evalCount ? Math.round(passCount / evalCount * 100) : 0;

  // Item stats
  const iMap = new Map();
  for (const r of results) {
    const key = r.nombre_item || r.numero_item;
    if (!key) continue;
    if (!iMap.has(key)) iMap.set(key, { name: key, pass:0, fail:0, total:0, byDevice:{} });
    const it = iMap.get(key);
    it.total++;
    if (r.estado === 'PASS') it.pass++;
    if (r.estado === 'FAIL') { it.fail++; if (r.dispositivo) it.byDevice[r.dispositivo] = (it.byDevice[r.dispositivo]||0)+1; }
  }
  const itemStats = [...iMap.values()]
    .map(it => {
      const ev = it.pass + it.fail;
      return { ...it, evalChecks: ev,
               failRate:   ev         ? Math.round(it.fail/ev*100)         : 0,
               pctOfFails: failCount  ? Math.round(it.fail/failCount*100)  : 0,
               topDevice:  Object.entries(it.byDevice||{}).sort((a,b)=>b[1]-a[1])[0] || null };
    })
    .filter(it => it.total >= 3)
    .sort((a,b) => b.fail - a.fail);

  // Device stats
  const allDevices = [...new Set(results.map(r => r.dispositivo).filter(Boolean))];
  const deviceStats = allDevices.map(dev => {
    const rr = results.filter(r => r.dispositivo === dev);
    const f  = rr.filter(r => r.estado === 'FAIL').length;
    const p  = rr.filter(r => r.estado === 'PASS').length;
    const ev = p + f;
    return { dev, failCount: f, evalChecks: ev, failPctEval: ev ? Math.round(f/ev*100) : 0,
             pctOfFails: failCount ? Math.round(f/failCount*100) : 0 };
  }).sort((a,b) => b.failCount - a.failCount);

  // ── Período anterior (misma duración y filtros) para comparativa ──
  let prev = null;
  if (activeDays) {
    const tipoSel   = document.getElementById('an-tipo')?.value || '';
    const franjaSel = document.getElementById('an-franja')?.value || '';
    const cut = new Date(); cut.setDate(cut.getDate() - activeDays);
    const prevStart = new Date(cut); prevStart.setDate(prevStart.getDate() - activeDays);
    const cutStr = cut.toISOString().slice(0,10), prevStr = prevStart.toISOString().slice(0,10);
    const prevRuns = allRuns.filter(r => {
      const f = r.fecha || '';
      if (f < prevStr || f >= cutStr) return false;
      if (tipoSel   && r.tipo        !== tipoSel)   return false;
      if (franjaSel && r.hora_franja !== franjaSel) return false;
      return true;
    });
    if (prevRuns.length) {
      const pSet = new Set(prevRuns.map(r => r.id));
      const pRes = dedup(allResults.filter(r => pSet.has(r.run_id)));
      const pf = pRes.filter(r => r.estado === 'FAIL').length;
      const pp = pRes.filter(r => r.estado === 'PASS').length;
      const byDev = {};
      for (const r of pRes) {
        if (!r.dispositivo || (r.estado !== 'FAIL' && r.estado !== 'PASS')) continue;
        if (!byDev[r.dispositivo]) byDev[r.dispositivo] = { f:0, p:0 };
        if (r.estado === 'FAIL') byDev[r.dispositivo].f++; else byDev[r.dispositivo].p++;
      }
      const fmtD = d => d.slice(8) + '/' + d.slice(5,7);
      const lastPrev = new Date(cut); lastPrev.setDate(lastPrev.getDate() - 1);
      prev = { runs: prevRuns.length, fail: pf, pass: pp,
               failRate: (pf+pp) ? pf/(pf+pp)*100 : null,
               passRate: (pf+pp) ? pp/(pf+pp)*100 : null,
               devRate: Object.fromEntries(Object.entries(byDev).map(([d,c]) => [d, (c.f+c.p) ? c.f/(c.f+c.p)*100 : null])),
               range: `${fmtD(prevStr)} – ${fmtD(lastPrev.toISOString().slice(0,10))}` };
    }
  }
  // Delta en puntos porcentuales; lowerIsBetter define el color (verde = mejora)
  function deltaPP(cur, before, lowerIsBetter = true) {
    if (before === null || before === undefined || cur === null || cur === undefined) return '<span class="delta d-na">nuevo</span>';
    const d = Math.round((cur - before) * 10) / 10;
    if (Math.abs(d) < 0.5) return '<span class="delta d-eq">= sin cambio</span>';
    const better = lowerIsBetter ? d < 0 : d > 0;
    return `<span class="delta ${better ? 'd-good' : 'd-bad'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toLocaleString('de-DE')} pp</span>`;
  }
  function deltaCount(cur, before, lowerIsBetter = true) {
    if (!before) return '';
    const pct = Math.round((cur - before) / before * 100);
    if (pct === 0) return '<span class="delta d-eq">= sin cambio</span>';
    const better = lowerIsBetter ? pct < 0 : pct > 0;
    return `<span class="delta ${better ? 'd-good' : 'd-bad'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}%</span>`;
  }
  function deltaNeutral(cur, before) {
    if (!before) return '';
    const pct = Math.round((cur - before) / before * 100);
    return pct === 0 ? '<span class="delta d-eq">= igual</span>' : `<span class="delta d-eq">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}%</span>`;
  }
  const curFailRateExact = evalCount ? failCount / evalCount * 100 : 0;
  const curPassRateExact = evalCount ? passCount / evalCount * 100 : 0;

  // Version stats for report
  function normVerR(v) { return (v||'').trim().replace(/\s*\(\s*/g,'(').replace(/\s*\)\s*/g,')'); }
  const snapMapR = {};
  for (const run of runs) {
    if (run.versiones_snapshot && Object.keys(run.versiones_snapshot).length > 0)
      snapMapR[run.id] = run.versiones_snapshot;
  }
  const byDevVerR = {};
  for (const res of results) {
    const snap = snapMapR[res.run_id];
    if (!snap) continue;
    const rawVer = snap[res.dispositivo];
    if (rawVer === undefined || rawVer === null) continue;
    const version = normVerR(rawVer);
    const key = `${res.dispositivo}|||${version}`;
    if (!byDevVerR[key]) byDevVerR[key] = { dispositivo: res.dispositivo, version, pass:0, fail:0, na:0, utt:0 };
    const g = byDevVerR[key];
    if (res.estado === 'PASS') g.pass++;
    else if (res.estado === 'FAIL') g.fail++;
    else if (res.estado === 'N/A') g.na++;
    else if (res.estado === 'UNABLE TO TEST') g.utt++;
  }
  // Group by device
  const byDeviceR = {};
  for (const d of Object.values(byDevVerR)) {
    if (!byDeviceR[d.dispositivo]) byDeviceR[d.dispositivo] = [];
    byDeviceR[d.dispositivo].push(d);
  }
  for (const dev of Object.keys(byDeviceR)) byDeviceR[dev].sort(semverCmp);
  const versionDevices = Object.keys(byDeviceR).sort((a, b) => {
    const oa = deviceOrderMap[a] ?? 9999;
    const ob = deviceOrderMap[b] ?? 9999;
    return oa !== ob ? oa - ob : a.localeCompare(b);
  });
  const hasVersionData = versionDevices.length > 0;

  // Per-run trend
  // Tendencia agregada según el período: semana (≥60 días), día (≥14 días) o run
  const trendGran = (!activeDays || activeDays >= 60) ? 'week' : activeDays >= 14 ? 'day' : 'run';
  const resByRun = {};
  for (const r of results) {
    if (r.estado !== 'FAIL' && r.estado !== 'PASS') continue;
    if (!resByRun[r.run_id]) resByRun[r.run_id] = { f:0, p:0 };
    if (r.estado === 'FAIL') resByRun[r.run_id].f++; else resByRun[r.run_id].p++;
  }
  const trendBuckets = new Map();
  for (const run of runs) {
    const c = resByRun[run.id]; if (!c) continue;
    const fecha = run.fecha || ''; let key, label;
    if (trendGran === 'run')      { key = fecha + ' ' + (run.hora_franja||''); label = fecha.slice(5) + ' ' + (run.hora_franja||'').slice(0,5); }
    else if (trendGran === 'day') { key = fecha; label = fecha.slice(8) + '/' + fecha.slice(5,7); }
    else { const d = new Date(fecha + 'T00:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
           key = d.toISOString().slice(0,10); label = key.slice(8) + '/' + key.slice(5,7); }
    if (!trendBuckets.has(key)) trendBuckets.set(key, { key, label, f:0, p:0, runs:0 });
    const b = trendBuckets.get(key); b.f += c.f; b.p += c.p; b.runs++;
  }
  const runTrend = [...trendBuckets.values()].sort((a,b) => a.key.localeCompare(b.key))
    .map(b => ({ label: b.label, failRate: (b.f+b.p) ? Math.round(b.f/(b.f+b.p)*100) : 0, failCount: b.f, runs: b.runs }));

  const top5 = itemStats.slice(0, 5);

  // ── Paleta del reporte (print-first, marca Mediastream) ──
  // Tokens oficiales — skill mediastream-brand-identity (Sección 3 / 9.1)
  const C = { lime:'#97D700', limeText:'#5A8200', violet:'#A572EB', ink:'#1A1A1A', cloud:'#EDEDED', red:'#FC3737',
              ink3:'rgba(26,26,26,.55)', line:'rgba(26,26,26,.12)' };
  const statusOf = rate => rate > 20 ? 'bad' : rate > 10 ? 'warn' : 'good';
  const pill = (rate, thr=[15,30]) => {
    const s = rate > thr[1] ? 'bad' : rate > thr[0] ? 'warn' : 'good';
    return `<span class="pill pill-${s}">${rate}%</span>`;
  };
  const pillPass = pct => { const s = statusOf(100 - pct); return `<span class="pill pill-${s}">${pct}%</span>`; };

  // Heatmap: top 8 devices × top 8 items (columnas numeradas + referencia debajo)
  const hmDevices = deviceStats.slice(0, 8);
  const hmItems   = itemStats.slice(0, 8);
  const hmCells   = {};
  for (const r of results) {
    if (r.estado !== 'FAIL' && r.estado !== 'PASS') continue;
    const item = r.nombre_item || r.numero_item;
    if (!item || !r.dispositivo) continue;
    const k = `${r.dispositivo}||${item}`;
    if (!hmCells[k]) hmCells[k] = { f:0, p:0 };
    if (r.estado === 'FAIL') hmCells[k].f++;
    if (r.estado === 'PASS') hmCells[k].p++;
  }
  function hmClass(rate) {
    if (rate === null) return 'hm-na';
    if (rate === 0)    return 'hm-0';
    if (rate <= 15)    return 'hm-1';
    if (rate <= 30)    return 'hm-2';
    if (rate <= 50)    return 'hm-3';
    return 'hm-4';
  }
  const heatmapHeaderCells = hmItems.map((it,i) => `<th class="hm-th" title="${escHtml(it.name)}">${i+1}</th>`).join('');
  const heatmapRows = hmDevices.map(({dev}) =>
    `<tr>
      <td class="hm-dev">${escHtml(dev)}</td>
      ${hmItems.map(it => {
        const c = hmCells[`${dev}||${it.name}`];
        const ev = c ? c.f + c.p : 0;
        const rate = ev ? Math.round(c.f/ev*100) : null;
        return `<td class="hm-cell ${hmClass(rate)}">${rate !== null ? rate+'%' : '—'}</td>`;
      }).join('')}
    </tr>`
  ).join('');

  // Resumen por dispositivo (barras horizontales)
  const devMaxRate = Math.max(...deviceStats.map(d => d.failPctEval), 1);
  const deviceRows = deviceStats.slice(0, 10).map(d => `
    <tr>
      <td class="dev-name">${escHtml(d.dev)}</td>
      <td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, d.failPctEval/devMaxRate*100).toFixed(1)}%"></div></div></td>
      <td class="num">${pill(d.failPctEval)}</td>
      <td class="num strong">${d.failCount.toLocaleString('de-DE')}</td>
      <td class="num muted">${d.pctOfFails}%</td>
      <td class="num muted">${d.evalChecks.toLocaleString('de-DE')}</td>
      ${prev ? `<td class="num">${deltaPP(d.evalChecks ? d.failCount/d.evalChecks*100 : null, prev.devRate[d.dev])}</td>` : ''}
    </tr>`).join('');

  // Gráfico de evolución (SVG responsive, escala fija)
  const trendSamples = runTrend.slice(-26);
  const trendTitle = trendGran === 'week' ? `Por semana (${trendSamples.length} semanas, inicio lunes)` : trendGran === 'day' ? `Por día (${trendSamples.length} días)` : `Últimos ${trendSamples.length} runs`;
  const tRaw = Math.max(...trendSamples.map(r => r.failRate), 1);
  const yMax = Math.max(Math.ceil(tRaw / 10) * 10, 20);
  const svgW = 640, svgH = 150, mL = 36, mB = 22, mT = 8;
  const plotW = svgW - mL - 8, plotH = svgH - mB - mT;
  const n = Math.max(trendSamples.length, 1);
  const slot = plotW / n;
  const bw = Math.max(4, Math.min(22, slot - 4));
  const gridVals = [0, Math.round(yMax/2), yMax];
  const gridLines = gridVals.map(v => {
    const gy = (mT + plotH - v/yMax*plotH).toFixed(1);
    return `<line x1="${mL}" y1="${gy}" x2="${svgW-8}" y2="${gy}" stroke="#e4e4e4" stroke-width="1"/>
            <text x="${mL-6}" y="${(parseFloat(gy)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="${C.ink3}">${v}%</text>`;
  }).join('');
  const sparkBars = trendSamples.map((r,i) => {
    const h = Math.max(2, r.failRate / yMax * plotH);
    const x = mL + i*slot + (slot-bw)/2;
    const y = mT + plotH - h;
    const col = { good: C.lime, warn: C.violet, bad: C.red }[statusOf(r.failRate)];
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${col}"><title>${escHtml(r.label)} · ${r.failRate}% (${r.failCount} FAILs · ${r.runs} runs)</title></rect>`;
  }).join('');
  const xLabels = trendSamples.length ? [0, Math.floor((trendSamples.length-1)/2), trendSamples.length-1]
    .filter((v,i,a) => a.indexOf(v) === i)
    .map(i => { const anchor = i === 0 ? 'start' : i === trendSamples.length-1 ? 'end' : 'middle';
      const x = anchor === 'start' ? mL + i*slot : anchor === 'end' ? mL + (i+1)*slot : mL + i*slot + slot/2;
      return `<text x="${x.toFixed(1)}" y="${svgH-6}" text-anchor="${anchor}" font-size="9" fill="${C.ink3}">${escHtml(trendSamples[i].label)}</text>`; }).join('') : '';
  const avgLine = evalCount ? (failCount / evalCount * 100) : 0;
  const avgY = (mT + plotH - avgLine/yMax*plotH).toFixed(1);
  const sparkSVG = `<svg viewBox="0 0 ${svgW} ${svgH}" width="100%" style="display:block;font-family:inherit;height:auto">
    ${gridLines}${sparkBars}
    <line x1="${mL}" y1="${avgY}" x2="${svgW-8}" y2="${avgY}" stroke="${C.ink}" stroke-width="1.2" stroke-dasharray="5,4" opacity=".8"/>
    <text x="${svgW-10}" y="${(parseFloat(avgY)-4).toFixed(1)}" text-anchor="end" font-size="9" font-weight="700" fill="${C.ink}">promedio ${failPctEval}%</text>
    ${xLabels}
  </svg>`;

  // Versiones: solo las 4 más recientes por dispositivo
  const MAX_VER = 4;
  let hiddenVersions = 0;
  const versionRows = versionDevices.map(dev => {
    const list = byDeviceR[dev];
    const shown = list.slice(0, MAX_VER);
    hiddenVersions += list.length - shown.length;
    return shown.map((r,i) => {
      const ev = r.pass + r.fail;
      const pct = ev ? Math.round(r.pass/ev*100) : 0;
      const devCell = i === 0 ? `<td class="dev-name" rowspan="${shown.length}">${escHtml(dev)}${list.length > MAX_VER ? `<div class="muted" style="font-size:8.5px;font-weight:400;margin-top:2px">+${list.length-MAX_VER} anteriores</div>` : ''}</td>` : '';
      return `<tr>
        ${devCell}
        <td class="mono">${escHtml(r.version)}</td>
        <td class="num">${r.pass.toLocaleString('de-DE')}</td>
        <td class="num ${r.fail ? 'strong' : 'muted'}">${r.fail.toLocaleString('de-DE')}</td>
        <td class="num muted">${r.na.toLocaleString('de-DE')}</td>
        <td class="num muted">${r.utt.toLocaleString('de-DE')}</td>
        <td class="num">${pillPass(pct)}</td>
      </tr>`;
    }).join('');
  }).join('');

  // Conclusión automática
  const criticos = top5.filter(it => it.pctOfFails >= 10);
  let trendSentence = '';
  if (prev && prev.failRate !== null) {
    const d = Math.round((curFailRateExact - prev.failRate) * 10) / 10;
    if (Math.abs(d) < 0.5) trendSentence = `Respecto al período anterior (${prev.range}), la tasa de fallo se mantiene estable (${Math.round(prev.failRate)}% → ${failPctEval}%). `;
    else if (d < 0) trendSentence = `Respecto al período anterior (${prev.range}), la tasa de fallo <strong>mejora ${Math.abs(d).toLocaleString('de-DE')} pp</strong> (${Math.round(prev.failRate)}% → ${failPctEval}%). `;
    else trendSentence = `Respecto al período anterior (${prev.range}), la tasa de fallo <strong>empeora ${d.toLocaleString('de-DE')} pp</strong> (${Math.round(prev.failRate)}% → ${failPctEval}%). `;
    const worsened = deviceStats.filter(x => x.evalChecks && prev.devRate[x.dev] !== undefined && prev.devRate[x.dev] !== null)
      .map(x => ({ dev: x.dev, d: x.failCount/x.evalChecks*100 - prev.devRate[x.dev] }))
      .filter(x => x.d >= 2).sort((a,b) => b.d - a.d).slice(0, 2);
    if (worsened.length) trendSentence += `${worsened.length > 1 ? 'Los dispositivos con mayor deterioro son' : 'El dispositivo con mayor deterioro es'} ${worsened.map(x => `<strong>${escHtml(x.dev)}</strong> (+${(Math.round(x.d*10)/10).toLocaleString('de-DE')} pp)`).join(' y ')}. `;
  }
  const worstDev = deviceStats[0];
  let conclusion = trendSentence;
  if (criticos.length)

  .tag-date{font-size:8pt;font-weight:400;color:${C.lime};text-align:right;margin-top:2px}

  /* Portada: bloque dark con dot grid de marca */

  .hero-status{background:#fff;color:${C.ink};border-radius:6pt;padding:14px 18px;min-width:168px;text-align:center;display:flex;flex-direction:column;justify-content:center}

  h2{font-size:14pt;font-weight:700;color:${C.ink};margin:22px 0 10px;display:flex;align-items:center;gap:10px}

  /* KPI cards (Sección 6 del manual) */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;break-inside:avoid}

  .print-btn{position:fixed;bottom:24px;right:24px;background:linear-gradient(45deg,#97D700,#B3E837);color:${C.ink};border:none;border-radius:100px;padding:14px 24px;font-family:'Encode Sans Expanded',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(151,215,0,.45);transition:transform .25s ease-in}

</style>
</head>
<body>
<div class="sheet">
<table class="layout">
  <thead><tr><td></td></tr></thead>
  <tfoot><tr><td>
    <div class="pfoot">
      <span>${ISO_SVG} Informe de Monitoreo — ${escHtml(clienteNombre)} · ${escHtml(lbl)} — Confidencial</span>

  </td></tr></tfoot>

    ${LOGO_SVG}

      <div class="hero-meta">
        Período: <b>${escHtml(lbl)}</b><br>
        Runs analizados: <b>${totalRuns.toLocaleString('de-DE')}</b> · Checks evaluados: <b>${totalChecks.toLocaleString('de-DE')}</b>${prev ? `<br>Comparado con el período anterior: <b>${prev.range}</b>` : ''}
      </div>
    </div>

      <div class="status-lbl"><span class="dot dot-${semKey}"></span>${semLabel}</div>

      <div class="status-sub">tasa de fallo evaluable</div>
      ${prev && prev.failRate !== null ? `<div class="status-delta">${deltaPP(curFailRateExact, prev.failRate)} <span>vs ${Math.round(prev.failRate)}% anterior</span></div>` : ''}
    </div>

    <div class="kpi"><div class="kpi-label">Tasa de PASS</div><div class="kpi-val">${passPctEval}%</div>${prev && prev.passRate !== null ? `<div class="kpi-delta">${deltaPP(curPassRateExact, prev.passRate, false)}<span class="kpi-prev">antes ${Math.round(prev.passRate)}%</span></div>` : ''}<div class="kpi-sub">${passCount.toLocaleString('de-DE')} checks PASS</div></div>
    <div class="kpi"><div class="kpi-label">Runs completados</div><div class="kpi-val">${totalRuns.toLocaleString('de-DE')}</div>${prev ? `<div class="kpi-delta">${deltaNeutral(totalRuns, prev.runs)}<span class="kpi-prev">antes ${prev.runs.toLocaleString('de-DE')}</span></div>` : ''}<div class="kpi-sub">en el período</div></div>
    <div class="kpi"><div class="kpi-label">N/A + UTT</div><div class="kpi-val">${(naCount+uttCount).toLocaleString('de-DE')}</div><div class="kpi-sub">excluidos del denominador</div></div>
  </div>
  </div>

  <div class="sec">

  <div class="card flush">
    <table class="data">
      <thead><tr>
        <th>#</th><th>Ítem</th><th class="num">FAILs</th><th>% del total</th><th class="num">Tasa de fallo</th><th>Dispositivo top</th>
      </tr></thead>
      <tbody>${top5Rows}</tbody>
    </table>

  </div>

  <div class="sec flow">

  <div class="card flush">
    <table class="data">
      <thead><tr>
        <th>Dispositivo</th><th>Tasa de fallo</th><th class="num"></th><th class="num">FAILs</th><th class="num">% del total</th><th class="num">Checks eval.</th>${prev ? '<th class="num">vs anterior</th>' : ''}
      </tr></thead>

      </tr></thead>
      <tbody>${versionRows}</tbody>
    </table>
  </div>
  <div class="note">Se muestran hasta ${MAX_VER} versiones recientes por dispositivo${hiddenVersions ? ` (${hiddenVersions} versiones anteriores omitidas)` : ''}. % PASS evaluable = PASS / (PASS + FAIL).</div>
  </div>` : ''}

<div class="print-tip no-print">Tip: en el diálogo de impresión, elige "Guardar como PDF" y desactiva márgenes/encabezados si aparecen.</div>
