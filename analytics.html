<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Analytics — Checklist QA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@300;400;600;900&display=swap" rel="stylesheet">
<style>
/* ── Tokens ── */
:root{
  --bg:#080A18;--surface:#0E1126;--card:#141A32;
  --border:rgba(80,100,200,0.18);--border2:rgba(80,100,200,0.10);
  --text:#e8eaf0;--muted:#7c82a0;--dim:#4a4f6a;
  --pass:#1baf7a;--fail:#e34948;--na:#898781;--utt:#eda100;
  --green:#97D700;--purple:#8E65D8;
  --grid:rgba(80,100,200,0.10);
  --radius:12px;
  --cliente-color:#7B2FBE;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Encode Sans Expanded','Helvetica Neue',Arial,sans-serif;font-size:13px;background:var(--bg);color:var(--text);line-height:1.5}

/* ── Nav ── */
.sitenav{display:flex;gap:4px;padding:8px 14px;background:#0a0c12;border-bottom:1px solid #1e2235;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.snav-link{color:#7c82a0;font-size:12px;font-weight:600;text-decoration:none;padding:5px 11px;border-radius:7px;transition:.15s;display:flex;align-items:center;gap:6px}
.snav-link:hover{color:#e8eaf0;background:#1a1d27}
.snav-link.active{color:#c3a0ff;background:#1a1d27}
.snav-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{font-size:11px;color:#7c82a0}
.logout-btn{background:none;border:1px solid #2e3350;color:#7c82a0;border-radius:7px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;transition:.15s}
.logout-btn:hover{color:#f87171;border-color:#f87171}
.nav-role-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:none}
.nav-role-badge.superadmin{background:#4f46e5;color:#fff}
.nav-role-badge.admin{background:#1e2035;color:#c3a0ff;border:1px solid #6366f1}
.nav-role-badge.operador{background:#1a2e1f;color:#4ade80;border:1px solid #166534}
.nav-role-badge.viewer{background:#1a1d27;color:#7c82a0;border:1px solid #2e3350}
.cliente-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#e8eaf0;background:#1a1d27;border:1px solid rgba(180,140,255,0.25);border-radius:8px;padding:3px 10px 3px 6px}
.cliente-dot{width:8px;height:8px;border-radius:50%;background:var(--cliente-color,#7B2FBE);flex-shrink:0}

/* ── Layout ── */
.page{max-width:1280px;margin:0 auto;padding:24px 20px 48px}

/* ── Page header ── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.3px}
.page-subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-btn{background:#141A32;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 13px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.03em}
.filter-btn:hover{color:var(--text);border-color:var(--purple)}
.filter-btn.active{color:#fff;background:var(--purple);border-color:var(--purple)}

/* ── KPI tiles ── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--purple))}
.kpi-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.kpi-value{font-size:32px;font-weight:900;color:#fff;line-height:1;letter-spacing:-1px}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:6px}
.kpi-good{--accent:var(--pass)}
.kpi-bad{--accent:var(--fail)}
.kpi-info{--accent:var(--purple)}
.kpi-warn{--accent:var(--utt)}

/* ── Charts ── */
.charts-grid-1{margin-bottom:20px}
.charts-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
@media(max-width:720px){.charts-grid-2{grid-template-columns:1fr}}

.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px}
.chart-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px}
.chart-desc{font-size:11px;color:var(--muted);margin-bottom:16px}
.chart-wrap{position:relative}

/* ── Loading/empty ── */
.loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:14px;color:var(--muted);font-size:13px}
.spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{text-align:center;color:var(--muted);padding:40px;font-size:12px}

/* ── Footer note ── */
.footnote{font-size:10px;color:var(--dim);margin-top:8px;text-align:right}
</style>
</head>
<body>

<nav class="sitenav">
  <a href="./dashboard.html" class="snav-link"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
  <a href="./checklist.html" class="snav-link" id="navChecklist"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Checklist</a>
  <a href="./admin_dispositivos.html" class="snav-link" id="navDispositivos" style="display:none"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg>Dispositivos</a>
  <a href="./admin.html" class="snav-link" id="navItems" style="display:none"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><polyline points="3 6 4 7 6 5"/><polyline points="3 12 4 13 6 11"/><polyline points="3 18 4 19 6 17"/></svg>Ítems</a>
  <a href="./backup.html" class="snav-link" id="navBackup" style="display:none"><svg viewBox="0 0 24 24"><polyline points="21 15 21 21 3 21 3 15"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Backup</a>
  <a href="./analytics.html" class="snav-link active" id="navAnalytics"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Analytics</a>
  <a href="./admin_usuarios.html" class="snav-link" id="navUsuarios" style="display:none"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Usuarios</a>
  <a href="./admin_clientes.html" class="snav-link" id="navClientes" style="display:none"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Clientes</a>
  <div class="nav-right">
    <span class="cliente-chip" id="clienteChip" style="display:none">
      <span class="cliente-dot" id="clienteDot"></span>
      <span id="clienteNombre"></span>
      <a href="./select_cliente.html" style="color:var(--muted);text-decoration:none;font-size:10px">⇄ cambiar</a>
    </span>
    <span class="nav-role-badge" id="roleBadge"></span>
    <span class="user-chip" id="userEmail"></span>
    <button class="logout-btn" onclick="doLogout()">Cerrar sesión</button>
  </div>
</nav>

<div class="page">

  <div class="page-header">
    <div>
      <div class="page-title">Analytics</div>
      <div class="page-subtitle" id="clienteSubtitle">Cargando...</div>
    </div>
    <div class="filter-row" style="flex-wrap:wrap;gap:8px">
      <button class="filter-btn" data-days="30" onclick="setRange(30)">Últimos 30 días</button>
      <button class="filter-btn active" data-days="90" onclick="setRange(90)">Últimos 90 días</button>
      <button class="filter-btn" data-days="0" onclick="setRange(0)">Todo</button>
      <select id="an-tipo" onchange="selectedDevice=null;renderPage()" style="background:#0E1126;border:1px solid rgba(80,100,200,0.3);color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;outline:none;color-scheme:dark;cursor:pointer">
        <option value="">Todos los tipos</option>
        <option value="monitoreo">Monitoreo</option>
        <option value="soporte">Soporte</option>
      </select>
      <select id="an-franja" onchange="selectedDevice=null;renderPage()" style="background:#0E1126;border:1px solid rgba(80,100,200,0.3);color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;outline:none;color-scheme:dark;cursor:pointer">
        <option value="">Todas las franjas</option>
        <option>01:00</option><option>04:00</option><option>07:00</option><option>10:00</option>
        <option>13:00</option><option>16:00</option><option>19:00</option><option>22:00</option>
      </select>
    </div>
  </div>

  <div id="mainContent">
    <div class="loading-overlay">
      <div class="spinner"></div>
      <span>Cargando datos...</span>
    </div>
  </div>

</div>

<script>
const SUPA_URL = 'https://akpuifenfstvobwtqtcq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrcHVpZmVuZnN0dm9id3RxdGNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDMxOTAsImV4cCI6MjEwMjM3OTE5MH0.5397pVE5XlyV2864iTf96Ttj--HqoffovzJ9Z9mI0ig';
const _sbc = supabase.createClient(SUPA_URL, SUPA_KEY);

let currentClienteId = null;
let currentClienteColor = '#7B2FBE';
let allRuns = [];
let allResults = [];
let activeDays = 90;

// ── Charts instances (to destroy on re-render) ──
const chartInstances = {};

// ── Auth & boot ──
(async () => {
  const { data:{ session } } = await _sbc.auth.getSession();
  if (!session) { window.location.href = './login.html'; return; }

  document.getElementById('userEmail').textContent = session.user.email;

  // Role
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/profiles?id=eq.${session.user.id}&select=nombre,rol`,
      { headers:{ apikey:SUPA_KEY, Authorization:'Bearer '+session.access_token } });
    if (r.ok) {
      const [p] = await r.json();
      if (p) {
        applyNavRole(p.rol||'operador');
        if (p.nombre) document.getElementById('userEmail').textContent = p.nombre;
      }
    }
  } catch(_) {}

  // Cliente
  const raw = sessionStorage.getItem('ditu_cliente');
  if (!raw) { window.location.href = './select_cliente.html'; return; }
  const c = JSON.parse(raw);
  currentClienteId = c.id;
  currentClienteColor = c.color_primario || '#7B2FBE';
  document.documentElement.style.setProperty('--cliente-color', currentClienteColor);

  const chip = document.getElementById('clienteChip');
  if (chip) chip.style.display = 'inline-flex';
  const dot = document.getElementById('clienteDot');
  if (dot) dot.style.background = currentClienteColor;
  const nom = document.getElementById('clienteNombre');
  if (nom) nom.textContent = c.nombre;
  document.getElementById('clienteSubtitle').textContent = `Métricas históricas · ${c.nombre}`;

  await loadAll();
  renderPage();
})();

function applyNavRole(rol) {
  const isAdmin=rol==='superadmin'||rol==='admin';
  const isOperadorOrAbove=isAdmin||rol==='operador';
  const isSuperAdmin=rol==='superadmin';
  const isViewer=rol==='viewer';
  const navCl=document.getElementById('navChecklist');if(navCl)navCl.style.display=isViewer?'none':'';
  ['navItems','navBackup'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=isAdmin?'':'none';});
  ['navDispositivos'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=isOperadorOrAbove?'':'none';});
  const navU=document.getElementById('navUsuarios');if(navU)navU.style.display=isSuperAdmin?'':'none';
  const navC=document.getElementById('navClientes');if(navC)navC.style.display=isSuperAdmin?'':'none';
  const badge=document.getElementById('roleBadge');
  if(badge){badge.textContent=rol;badge.className=`nav-role-badge ${rol}`;badge.style.display='inline-block';}
}

async function doLogout() {
  await _sbc.auth.signOut();
  sessionStorage.removeItem('ditu_cliente');
  window.location.href = './login.html';
}

// ── Data loading ──
async function supaFetch(path) {
  const r = await fetch(SUPA_URL + path, {
    headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadAll() {
  const clienteFilter = currentClienteId ? `&cliente_id=eq.${currentClienteId}` : '';

  // Load all runs
  allRuns = await supaFetch(`/rest/v1/checklist_runs?select=*&order=fecha.asc,hora_franja.asc${clienteFilter}`);

  if (!allRuns.length) { allResults = []; return; }

  // Load results in batches of 50 run IDs — all batches in parallel
  const runIds = allRuns.map(r => r.id);
  const PAGE = 1000;
  const BATCH = 50; // keep URL length safe

  async function fetchBatch(ids) {
    const rows = [];
    let offset = 0;
    while (true) {
      const chunk = await supaFetch(
        `/rest/v1/checklist_results?select=run_id,dispositivo,numero_item,nombre_item,seccion,estado&run_id=in.(${ids})&order=id&limit=${PAGE}&offset=${offset}`
      );
      rows.push(...(chunk || []));
      if (!chunk || chunk.length < PAGE) break;
      offset += PAGE;
    }
    return rows;
  }

  const batches = [];
  for (let i = 0; i < runIds.length; i += BATCH) {
    batches.push(runIds.slice(i, i + BATCH).join(','));
  }
  const batchResults = await Promise.all(batches.map(ids => fetchBatch(ids)));
  allResults = batchResults.flat();
}

// ── Dedup: per (run_id, numero_item, dispositivo), FAIL wins ──
function dedup(results) {
  const priority = { 'FAIL':3, 'UNABLE TO TEST':2, 'N/A':1, 'PASS':0 };
  const map = new Map();
  for (const r of results) {
    const key = `${r.run_id}|${r.numero_item}|${r.dispositivo}`;
    const cur = map.get(key);
    if (!cur || (priority[r.estado]??-1) > (priority[cur.estado]??-1)) map.set(key, r);
  }
  return [...map.values()];
}

// ── Range filter ──
function setRange(days) {
  activeDays = days;
  selectedDevice = null; // reset filtro al cambiar rango
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.days) === days);
  });
  renderPage();
}

function filteredRuns() {
  const tipoSel   = document.getElementById('an-tipo')?.value || '';
  const franjaSel = document.getElementById('an-franja')?.value || '';
  return allRuns.filter(r => {
    if (activeDays) {
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - activeDays);
      if ((r.fecha || '') < cutoff.toISOString().slice(0,10)) return false;
    }
    if (tipoSel   && r.tipo        !== tipoSel)   return false;
    if (franjaSel && r.hora_franja !== franjaSel) return false;
    return true;
  });
}

// ── Main render ──
let selectedDevice = null; // filtro activo en chartDevices

function computeItemStats(results, deviceFilter) {
  const src = deviceFilter ? results.filter(r => r.dispositivo === deviceFilter) : results;
  const itemMap = new Map();
  for (const r of src) {
    const key = r.nombre_item || r.numero_item;
    if (!key) continue;
    if (!itemMap.has(key)) itemMap.set(key, { name: key, pass:0, fail:0, total:0 });
    const it = itemMap.get(key);
    it.total++;
    if (r.estado === 'PASS') it.pass++;
    if (r.estado === 'FAIL') it.fail++;
  }
  return [...itemMap.values()]
    .map(it => ({ ...it, failPct: Math.round(it.fail/it.total*100) }))
    .filter(it => it.total >= 3)
    .sort((a,b) => b.failPct - a.failPct)
    .slice(0, 10);
}

function renderPage() {
  const runs = filteredRuns();
  if (!runs.length) {
    document.getElementById('mainContent').innerHTML =
      '<div class="empty-msg">No hay runs en el período seleccionado.</div>';
    return;
  }

  const runSet = new Set(runs.map(r => r.id));
  const results = dedup(allResults.filter(r => runSet.has(r.run_id)));

  // ── Aggregate ──
  const totalRuns = runs.length;
  const totalChecks = results.length;
  const passCount = results.filter(r => r.estado === 'PASS').length;
  const failCount = results.filter(r => r.estado === 'FAIL').length;
  const avgPassPct = totalChecks ? Math.round(passCount / totalChecks * 100) : 0;

  // Per-run stats
  const runStats = runs.map(run => {
    const rr = results.filter(r => r.run_id === run.id);
    const p = rr.filter(r => r.estado === 'PASS').length;
    const f = rr.filter(r => r.estado === 'FAIL').length;
    const total = rr.length;
    return {
      id: run.id,
      label: (run.fecha||'').slice(5) + ' ' + (run.hora_franja||'').slice(0,5),
      fecha: run.fecha,
      hora_franja: run.hora_franja,
      operador: run.operador,
      passRate: total ? Math.round(p/total*100) : null,
      failRate: total ? Math.round(f/total*100) : null,
      pass: p, fail: f, total
    };
  }).filter(r => r.total > 0);

  // Per-device: % fail
  const devices = [...new Set(results.map(r => r.dispositivo).filter(Boolean))];
  const deviceStats = devices.map(dev => {
    const rr = results.filter(r => r.dispositivo === dev);
    const f = rr.filter(r => r.estado === 'FAIL').length;
    return { dev, failPct: rr.length ? Math.round(f/rr.length*100) : 0, total: rr.length };
  }).sort((a,b) => b.failPct - a.failPct);

  const bestDevice = [...deviceStats].sort((a,b) => a.failPct - b.failPct)[0];
  const worstDevice = deviceStats[0];

  // Per-item: % fail (top 10 worst) — respeta filtro de dispositivo activo
  const itemStats = computeItemStats(results, selectedDevice);

  const worstItem = itemStats[0];

  // Per-operator: run count
  const opMap = new Map();
  for (const run of runs) {
    const op = run.operador || 'Sin nombre';
    opMap.set(op, (opMap.get(op)||0)+1);
  }
  const opStats = [...opMap.entries()].sort((a,b)=>b[1]-a[1]);

  // ── Render HTML ──
  document.getElementById('mainContent').innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card kpi-info">
        <div class="kpi-label">Total Runs</div>
        <div class="kpi-value">${totalRuns}</div>
        <div class="kpi-sub">${totalChecks.toLocaleString()} checks únicos</div>
      </div>
      <div class="kpi-card ${avgPassPct >= 85 ? 'kpi-good' : avgPassPct >= 60 ? 'kpi-warn' : 'kpi-bad'}">
        <div class="kpi-label">Tasa de PASS promedio</div>
        <div class="kpi-value">${avgPassPct}<span style="font-size:16px;font-weight:400;color:var(--muted)">%</span></div>
        <div class="kpi-sub">${passCount.toLocaleString()} PASS · ${failCount.toLocaleString()} FAIL</div>
      </div>
      <div class="kpi-card kpi-bad">
        <div class="kpi-label">Dispositivo con más fallos</div>
        <div class="kpi-value" style="font-size:18px;line-height:1.3">${worstDevice ? worstDevice.dev : '—'}</div>
        <div class="kpi-sub">${worstDevice ? worstDevice.failPct+'% FAIL' : ''}</div>
      </div>
      <div class="kpi-card kpi-bad">
        <div class="kpi-label">Ítem más fallido</div>
        <div class="kpi-value" style="font-size:13px;font-weight:700;line-height:1.4;margin-top:4px">${worstItem ? truncate(worstItem.name,40) : '—'}</div>
        <div class="kpi-sub">${worstItem ? worstItem.failPct+'% FAIL en '+worstItem.total+' checks' : ''}</div>
      </div>
    </div>

    <div class="charts-grid-1">
      <div class="chart-card">
        <div class="chart-title">Tasa de PASS por run</div>
        <div class="chart-desc">Evolución cronológica — cada punto es un run completado</div>
        <div class="chart-wrap" style="height:240px"><canvas id="chartTrend"></canvas></div>
        <div class="footnote">Runs sin datos excluidos</div>
      </div>
    </div>

    <div class="charts-grid-2">
      <div class="chart-card">
        <div class="chart-title">FAILs por dispositivo</div>
        <div class="chart-desc">% FAIL del total de checks por dispositivo · click para filtrar ítems</div>
        <div class="chart-wrap" style="height:${Math.max(200, deviceStats.length*34)}px"><canvas id="chartDevices"></canvas></div>
      </div>
      <div class="chart-card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
          <div>
            <div class="chart-title" id="itemsChartTitle">Top ítems con más FAILs${selectedDevice ? ' — '+selectedDevice : ''}</div>
            <div class="chart-desc">% FAIL sobre total de checks · mínimo 3 apariciones</div>
          </div>
          ${selectedDevice ? `<button id="clearDeviceFilter" style="font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid #e34948;background:rgba(227,73,72,0.12);color:#e34948;cursor:pointer;font-family:inherit;white-space:nowrap">✕ ${selectedDevice}</button>` : ''}
        </div>
        <div class="chart-wrap" style="height:${Math.max(200, itemStats.length*34)}px"><canvas id="chartItems"></canvas></div>
      </div>
    </div>

    <div class="charts-grid-2">
      <div class="chart-card">
        <div class="chart-title">Runs por operador</div>
        <div class="chart-desc">Cantidad de checklists completados</div>
        <div class="chart-wrap" style="height:220px"><canvas id="chartOps"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Distribución de estados</div>
        <div class="chart-desc">Del total de checks en el período</div>
        <div class="chart-wrap" style="height:220px"><canvas id="chartStatus"></canvas></div>
      </div>
    </div>
  `;

  // ── Chart defaults ──
  Chart.defaults.color = '#7c82a0';
  Chart.defaults.font.family = "'Encode Sans Expanded','Helvetica Neue',Arial,sans-serif";
  Chart.defaults.font.size = 11;

  const gridColor = 'rgba(80,100,200,0.10)';
  const surface = '#141A32';

  // Helper: destroy previous instance
  function mkChart(id, config) {
    if (chartInstances[id]) chartInstances[id].destroy();
    chartInstances[id] = new Chart(document.getElementById(id), config);
  }

  // ── 1. Trend line ──
  const trendLabels = runStats.map(r => r.label);
  const trendData   = runStats.map(r => r.passRate);
  mkChart('chartTrend', {
    type: 'line',
    data: {
      labels: trendLabels,
      datasets: [{
        data: trendData,
        borderColor: '#97D700',
        backgroundColor: 'rgba(151,215,0,0.10)',
        borderWidth: 2,
        pointRadius: trendData.length <= 30 ? 5 : 3,
        pointHoverRadius: 7,
        pointBackgroundColor: '#97D700',
        fill: true,
        tension: 0.3,
        spanGaps: true,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.parsed.y}% PASS`,
            title: ctx => ctx[0].label,
          }
        }
      },
      scales: {
        x: {
          grid: { color: gridColor },
          ticks: { maxTicksLimit: 12, maxRotation: 35 }
        },
        y: {
          min: 0, max: 100,
          grid: { color: gridColor },
          ticks: { callback: v => v+'%', stepSize: 20 }
        }
      }
    }
  });

  // ── 2. Failing items (horizontal bar) ──
  mkChart('chartItems', {
    type: 'bar',
    data: {
      labels: itemStats.map(it => truncate(it.name, 35)),
      datasets: [{
        data: itemStats.map(it => it.failPct),
        backgroundColor: 'rgba(227,73,72,0.80)',
        borderColor: '#e34948',
        borderWidth: 1,
        borderRadius: 4,
        borderSkipped: 'left',
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.x}% FAIL` } }
      },
      scales: {
        x: {
          min: 0, max: 100,
          grid: { color: gridColor },
          ticks: { callback: v => v+'%' }
        },
        y: { grid: { display: false }, ticks: { font: { size: 10 } } }
      }
    }
  });

  // ── 3. Devices (horizontal bar) ──
  mkChart('chartDevices', {
    type: 'bar',
    data: {
      labels: deviceStats.map(d => d.dev),
      datasets: [{
        data: deviceStats.map(d => d.failPct),
        backgroundColor: 'rgba(227,73,72,0.80)',
        borderColor: '#e34948',
        borderWidth: 1,
        borderRadius: 4,
        borderSkipped: 'left',
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.x}% FAIL — ${deviceStats[ctx.dataIndex].total} checks` } }
      },
      scales: {
        x: {
          min: 0, max: 100,
          grid: { color: gridColor },
          ticks: { callback: v => v+'%' }
        },
        y: { grid: { display: false }, ticks: { font: { size: 10 } } }
      }
    }
  });

  // ── Click en dispositivo → filtra ítems ──
  document.getElementById('chartDevices').style.cursor = 'pointer';
  document.getElementById('chartDevices').onclick = function(evt) {
    const points = chartInstances['chartDevices'].getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true);
    if (!points.length) return;
    const dev = deviceStats[points[0].index].dev;
    selectedDevice = (selectedDevice === dev) ? null : dev;
    renderPage();
  };
  // Resaltar barra activa
  if (selectedDevice) {
    const ci = chartInstances['chartDevices'];
    ci.data.datasets[0].backgroundColor = deviceStats.map(d =>
      d.dev === selectedDevice ? '#e34948' : 'rgba(227,73,72,0.35)'
    );
    ci.update();
  }
  // Botón limpiar filtro
  const clearBtn = document.getElementById('clearDeviceFilter');
  if (clearBtn) clearBtn.onclick = () => { selectedDevice = null; renderPage(); };

  // ── 4. Operators ──
  mkChart('chartOps', {
    type: 'bar',
    data: {
      labels: opStats.map(o => o[0]),
      datasets: [{
        data: opStats.map(o => o[1]),
        backgroundColor: 'rgba(142,101,216,0.80)',
        borderColor: '#8E65D8',
        borderWidth: 1,
        borderRadius: 4,
        borderSkipped: 'bottom',
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y} runs` } }
      },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: gridColor }, ticks: { stepSize: 1 } }
      }
    }
  });

  // ── 5. Status donut ──
  const naCount  = results.filter(r => r.estado === 'N/A').length;
  const uttCount = results.filter(r => r.estado === 'UNABLE TO TEST').length;
  mkChart('chartStatus', {
    type: 'doughnut',
    data: {
      labels: ['PASS', 'FAIL', 'N/A', 'UNABLE TO TEST'],
      datasets: [{
        data: [passCount, failCount, naCount, uttCount],
        backgroundColor: ['#1baf7a','#e34948','#898781','#eda100'],
        borderColor: surface,
        borderWidth: 2,
        hoverOffset: 6,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '62%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: { boxWidth: 10, padding: 14, font: { size: 11 } }
        },
        tooltip: {
          callbacks: {
            label: ctx => {
              const v = ctx.parsed;
              const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
              return ` ${ctx.label}: ${v} (${Math.round(v/total*100)}%)`;
            }
          }
        }
      }
    }
  });
}

function truncate(str, max) {
  return str && str.length > max ? str.slice(0, max-1) + '…' : str;
}
</script>
</body>
</html>
