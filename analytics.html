</body>
</html>`;

  const w = window.open('', '_blank');
  if (!w) { alert('Permite ventanas emergentes para generar el reporte.'); return; }
  w.document.write(reportHTML);
  w.document.close();
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────────────
// TAB: POR VERSIÓN
// ─────────────────────────────────────────────────────
function buildVersiones(runs, results) {
  // Build runId → versiones_snapshot map (only runs that have snapshot)
  const snapMap = {};
  for (const run of runs) {
    if (run.versiones_snapshot && Object.keys(run.versiones_snapshot).length > 0) {
      snapMap[run.id] = run.versiones_snapshot;
    }
  }

  const runsWithSnap = runs.filter(r => snapMap[r.id]);
  if (!runsWithSnap.length) {
    return `<div class="empty-msg" style="padding:60px 20px">
      <div style="font-size:36px;opacity:.3;margin-bottom:12px">📦</div>
      No hay runs con versiones registradas en el período seleccionado.
    </div>`;
  }

  // Normalize version string: trim + collapse spaces around parentheses
  // Fixes: "2.8 (MTNPWFX002)" === "2.8.0(MTNPWFX002)" are different data issues,
  // but "2.8.0 (MTNPWFX002)" vs "2.8.0(MTNPWFX002)" (only space diff) must merge.
  function normVer(v) {
    return (v || '').trim().replace(/\s*\(\s*/g, '(').replace(/\s*\)\s*/g, ')');
  }

  // Group by (dispositivo, normalized-version)
  const byDevVer = {};
  for (const res of results) {
    const snap = snapMap[res.run_id];
    if (!snap) continue;
    const rawVer = snap[res.dispositivo];
    if (rawVer === undefined || rawVer === null) continue;
    const version = normVer(rawVer);
    const key = `${res.dispositivo}|||${version}`;
    if (!byDevVer[key]) {
      byDevVer[key] = { dispositivo: res.dispositivo, version, runs: new Set(), pass:0, fail:0, na:0, utt:0, failItems:{}, naItems:{}, uttItems:{} };
    }
    const g = byDevVer[key];
    g.runs.add(res.run_id);
    const itemKey = res.nombre_item || res.numero_item;
    if      (res.estado === 'PASS')           g.pass++;
    else if (res.estado === 'FAIL')         { g.fail++; if(itemKey) g.failItems[itemKey] = (g.failItems[itemKey]||0)+1; }
    else if (res.estado === 'N/A')          { g.na++;   if(itemKey) g.naItems[itemKey]   = (g.naItems[itemKey]||0)+1;  }
    else if (res.estado === 'UNABLE TO TEST'){ g.utt++;  if(itemKey) g.uttItems[itemKey]  = (g.uttItems[itemKey]||0)+1; }
  }

  // Group by device
  const byDevice = {};
  for (const data of Object.values(byDevVer)) {
    if (!byDevice[data.dispositivo]) byDevice[data.dispositivo] = [];
    byDevice[data.dispositivo].push({...data, runCount: data.runs.size});
  }

  // Sort: within each device, newest version first (string desc)
  for (const dev of Object.keys(byDevice)) {
    byDevice[dev].sort(semverCmp);
  }

  // Order devices by checklist_devices.orden, fallback to alphabetical
  const devices = Object.keys(byDevice).sort((a, b) => {
    const oa = deviceOrderMap[a] ?? 9999;
    const ob = deviceOrderMap[b] ?? 9999;
    return oa !== ob ? oa - ob : a.localeCompare(b);
  });
  const totalRunsWithSnap = runsWithSnap.length;

  // Build device filter buttons HTML
  const filterBtns = devices.map(d =>
    `<button class="filter-btn" onclick="filterVersionDev('${escHtml(d).replace(/'/g,"\\'")}',this)"
      style="font-size:11px;padding:4px 12px">${escHtml(d)}</button>`
  ).join('');

  let html = `
    <div class="chart-card" style="margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div>
        <div class="chart-title">Calidad por Versión</div>
        <div class="chart-desc" style="margin-bottom:0">Para cada dispositivo, el desempeño histórico separado por versión. Haz clic en una fila para ver los ítems que más fallaron en esa versión.</div>
      </div>
      <div style="margin-left:auto;text-align:right;flex-shrink:0">
        <div style="font-size:22px;font-weight:900;color:#fff">${totalRunsWithSnap}</div>
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">runs con versión</div>
      </div>
    </div>
    <div class="global-filter-bar" style="margin-bottom:16px">
      <span class="gfb-label">Dispositivo</span>
      <button class="filter-btn active" id="verDevFilterAll" onclick="filterVersionDev('__all__',this)"
        style="font-size:11px;padding:4px 12px">Todos</button>
      ${filterBtns}
    </div>`;

  for (const dev of devices) {
    const rows = byDevice[dev];
    const totalFail = rows.reduce((s,r) => s+r.fail, 0);
    const totalPass = rows.reduce((s,r) => s+r.pass, 0);
    const totalAll  = rows.reduce((s,r) => s+r.pass+r.fail+r.na+r.utt, 0);
    const globalPct = totalAll ? Math.round(totalPass/totalAll*100) : 0;
    const pctColor  = globalPct >= 90 ? 'var(--pass)' : globalPct >= 70 ? 'var(--utt)' : 'var(--fail)';

    html += `
      <div class="chart-card" data-ver-dev="${escHtml(dev)}" style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
          <div style="font-size:14px;font-weight:900;color:#fff">${escHtml(dev)}</div>
          <div style="display:flex;gap:12px;align-items:center;margin-left:auto">
            <span style="font-size:10px;color:var(--muted)">${rows.length} versión${rows.length!==1?'es':''}</span>
            <span style="font-size:10px;color:var(--fail)">${totalFail.toLocaleString('es-CL')} FAILs</span>
            <span style="font-size:12px;font-weight:700;color:${pctColor}">${globalPct}% PASS global</span>
          </div>
        </div>
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="border-bottom:1px solid var(--border)">
              <th style="text-align:left;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px 0">Versión</th>
              <th style="text-align:right;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 8px">Runs</th>
              <th style="text-align:right;font-size:9px;font-weight:700;color:var(--pass);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 8px">PASS</th>
              <th style="text-align:right;font-size:9px;font-weight:700;color:var(--fail);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 8px">FAIL</th>
              <th style="text-align:right;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 0 8px;min-width:110px">% PASS</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r, i) => {
              const total = r.pass + r.fail + r.na + r.utt;
              const pct   = total ? Math.round(r.pass/total*100) : 0;
              const pc    = pct >= 90 ? '#1baf7a' : pct >= 70 ? '#eda100' : '#e34948';
              function itemRows(map, color, label) {
                const top = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
                if (!top.length) return `<div style="font-size:11px;color:var(--muted);padding:6px 0;text-align:center">✓ Sin ${label} en esta versión</div>`;
                return top.map(([name,count]) =>
                  `<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(80,100,200,0.08)">
                    <span style="font-size:11px;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(name)}</span>
                    <span style="font-size:11px;font-weight:700;color:${color};white-space:nowrap;flex-shrink:0">${count} ${label}</span>
                  </div>`
                ).join('');
              }
              const failDetail = itemRows(r.failItems, 'var(--fail)', 'FAIL');
              const naDetail   = r.na  > 0 ? itemRows(r.naItems,   'var(--na,#898781)', 'N/A')  : null;
              const uttDetail  = r.utt > 0 ? itemRows(r.uttItems,  'var(--utt)',        'UTT')   : null;
              const detailId = `vdet_${i}_${encodeURIComponent(dev)}_${encodeURIComponent(r.version)}`.replace(/[^a-zA-Z0-9_]/g,'_');
              return `
                <tr onclick="toggleVerDetail('${detailId}')" style="cursor:pointer;transition:.1s"
                    onmouseenter="this.style.background='rgba(80,100,200,0.06)'"
                    onmouseleave="this.style.background=''">
                  <td style="padding:10px 8px 10px 0;border-bottom:1px solid var(--border2)">
                    <span style="font-size:12px;font-weight:700;color:#e8e8e8">${escHtml(r.version)}</span>
                  </td>
                  <td style="text-align:right;padding:10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border2)">${r.runCount}</td>
                  <td style="text-align:right;padding:10px;font-size:12px;font-weight:600;color:var(--pass);border-bottom:1px solid var(--border2)">${r.pass.toLocaleString('es-CL')}</td>
                  <td style="text-align:right;padding:10px;font-size:12px;font-weight:600;color:${r.fail?'var(--fail)':'var(--muted)'};border-bottom:1px solid var(--border2)">${r.fail.toLocaleString('es-CL')}</td>
                  <td style="text-align:right;padding:10px 0;border-bottom:1px solid var(--border2)">
                    <div style="display:flex;align-items:center;justify-content:flex-end;gap:7px">
                      <div style="width:56px;height:5px;background:rgba(80,100,200,0.15);border-radius:3px;overflow:hidden;flex-shrink:0">
                        <div style="height:100%;width:${pct}%;background:${pc};border-radius:3px"></div>
                      </div>
                      <span style="font-size:12px;font-weight:700;color:${pc};min-width:34px;text-align:right">${pct}%</span>
                      <span style="font-size:10px;color:var(--muted);flex-shrink:0">▾</span>
                    </div>
                  </td>
                </tr>
                <tr id="${detailId}" style="display:none">
                  <td colspan="5" style="padding:0 0 14px 0">
                    <div style="background:rgba(80,100,200,0.05);border:1px solid var(--border2);border-radius:8px;padding:12px 16px;margin-top:6px">
                      <!-- Resumen de estados -->
                      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border2)">
                        <div style="text-align:center">
                          <div style="font-size:16px;font-weight:900;color:var(--pass)">${r.pass.toLocaleString('es-CL')}</div>
                          <div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">PASS</div>
                        </div>
                        <div style="text-align:center">
                          <div style="font-size:16px;font-weight:900;color:${r.fail?'var(--fail)':'var(--muted)'}">${r.fail.toLocaleString('es-CL')}</div>
                          <div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">FAIL</div>
                        </div>
                        <div style="text-align:center">
                          <div style="font-size:16px;font-weight:900;color:${r.na?'var(--na,#898781)':'var(--muted)'}">${r.na.toLocaleString('es-CL')}</div>
                          <div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">N/A</div>
                        </div>
                        <div style="text-align:center">
                          <div style="font-size:16px;font-weight:900;color:${r.utt?'var(--utt)':'var(--muted)'}">${r.utt.toLocaleString('es-CL')}</div>
                          <div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">UTT</div>
                        </div>
                        <div style="margin-left:auto;text-align:right">
                          <div style="font-size:10px;color:var(--muted)">${escHtml(dev)} · v${escHtml(r.version)}</div>
                          <div style="font-size:10px;color:var(--dim)">${r.runCount} run${r.runCount!==1?'s':''} · ${total.toLocaleString('es-CL')} checks totales</div>
                        </div>
                      </div>
                      <!-- Top FAILs por ítem -->
                      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fail);margin-bottom:8px">Ítems con más FAILs</div>
                      ${failDetail}
                      ${naDetail ? `
                      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--na,#898781);margin-top:14px;margin-bottom:8px">Ítems con más N/A</div>
                      ${naDetail}` : ''}
                      ${uttDetail ? `
                      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--utt);margin-top:14px;margin-bottom:8px">Ítems con más Unable to Test</div>
                      ${uttDetail}` : ''}

                    </div>
                  </td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  return html;
}

// Semantic version sort: "2.10.0(build)" > "2.9.0" — compares X.Y.Z numerically, desc
function semverCmp(a, b) {
  const parts = v => v.version.split('(')[0].split('.').map(n => parseInt(n, 10) || 0);
  const pa = parts(a), pb = parts(b);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const diff = (pb[i] || 0) - (pa[i] || 0);
    if (diff !== 0) return diff;
  }
  return 0;
}

function toggleVerDetail(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const isOpen = el.style.display !== 'none';
  el.style.display = isOpen ? 'none' : 'table-row';
  // flip arrow on the trigger row
  const trigger = el.previousElementSibling;
  if (trigger) {
    const arrow = trigger.querySelector('span[style*="▾"], span[style*="▴"]');
    if (arrow) arrow.textContent = isOpen ? '▾' : '▴';
  }
}

function filterVersionDev(dev, btn) {
  // Update active button
  const bar = btn.closest('.global-filter-bar');
  if (bar) bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // Show/hide device cards
  document.querySelectorAll('[data-ver-dev]').forEach(card => {
    if (dev === '__all__' || card.dataset.verDev === dev) {
      card.style.display = '';
    } else {
      card.style.display = 'none';
    }
  });
}
</script>
