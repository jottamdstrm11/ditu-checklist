<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Dispositivos ditu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cliente-color:#6366f1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e8eaf0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:32px 24px}
h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:6px}
.subtitle{color:#7c82a0;font-size:13px;margin-bottom:28px}
.card{background:#1a1d27;border:1px solid #2e3350;border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:#22263a}
th{padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:#7c82a0;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid #2e3350}
td{padding:10px 16px;border-bottom:1px solid #1e2235;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1e2235}
input[type=text]{background:#0f1117;border:1px solid #2e3350;border-radius:7px;color:#e8eaf0;padding:7px 10px;font-size:13px;width:100%;font-family:inherit;transition:border .15s}
input[type=text]:focus{outline:none;border-color:var(--cliente-color)}
.toggle{position:relative;display:inline-flex;align-items:center;cursor:pointer;gap:8px;font-size:13px;color:#7c82a0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.slider{width:36px;height:20px;background:#2e3350;border-radius:10px;position:relative;transition:.2s}
.slider::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.toggle input:checked+.slider{background:var(--cliente-color)}
.toggle input:checked+.slider::after{left:19px}
.order-cell{display:flex;align-items:center;gap:6px}
.arrow-btn{background:#22263a;border:1px solid #2e3350;color:#7c82a0;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;transition:.15s}
.arrow-btn:hover{color:#e8eaf0;border-color:var(--cliente-color)}
.btn-save{background:var(--cliente-color);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s}
.btn-save:hover{filter:brightness(1.12)}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-add{background:#1a1e2e;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-add:hover{background:#22263a;border-color:var(--cliente-color);color:#fff}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap;gap:12px}
.sitenav{display:flex;gap:4px;padding:8px 14px;background:#0a0c12;border-bottom:1px solid #1e2235;flex-wrap:wrap;margin:-32px -24px 24px;position:sticky;top:0;z-index:100}
.snav-link{color:#7c82a0;font-size:12px;font-weight:600;text-decoration:none;padding:5px 11px;border-radius:7px;transition:.15s;display:flex;align-items:center;gap:6px}
.snav-link:hover{color:#e8eaf0;background:#1a1d27}
.snav-link.active{color:var(--cliente-color);background:#1a1d27}
.snav-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{font-size:11px;color:#7c82a0}
.logout-btn{background:none;border:1px solid #2e3350;color:#7c82a0;border-radius:7px;padding:4px 10px;font-size:11px;cursor:pointer;transition:.15s}
.logout-btn:hover{color:#f87171;border-color:#f87171}
.nav-role-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:none}
.nav-role-badge.superadmin{background:#4f46e5;color:#fff}
.nav-role-badge.admin{background:#1e2035;color:var(--cliente-color);border:1px solid var(--cliente-color)}
.nav-role-badge.operador{background:#1a2e1f;color:#4ade80;border:1px solid #166534}
.nav-role-badge.viewer{background:#1a1d27;color:#7c82a0;border:1px solid #2e3350}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#22263a;border:1px solid var(--cliente-color);border-radius:10px;padding:12px 24px;font-size:13px;color:#e8eaf0;display:none;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.show{display:block}
.toast.error{border-color:#f87171;color:#f87171}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.04em}
.badge-active{background:#1a3a2a;color:#34d399}
.badge-inactive{background:#3a1a1a;color:#f87171}
</style>
</head>
<body>
<nav class="sitenav">
  <a href="./dashboard.html" class="snav-link"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
  <a href="./checklist.html" class="snav-link"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Checklist</a>
  <a href="./admin_dispositivos.html" class="snav-link active" id="navDispositivos" style="display:none"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg>Dispositivos</a>
  <a href="./admin.html" class="snav-link" id="navItems" style="display:none"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><polyline points="3 6 4 7 6 5"/><polyline points="3 12 4 13 6 11"/><polyline points="3 18 4 19 6 17"/></svg>Ítems</a>
  <a href="./backup.html" class="snav-link" id="navBackup" style="display:none"><svg viewBox="0 0 24 24"><polyline points="21 15 21 21 3 21 3 15"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Backup</a>
  <a href="./admin_usuarios.html" class="snav-link" id="navUsuarios" style="display:none"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Usuarios</a>
  <a href="./admin_clientes.html" class="snav-link" id="navClientes" style="display:none"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Clientes</a>
  <div class="nav-right">
    <span class="nav-role-badge" id="roleBadge"></span>
    <span id="clienteChip" style="display:none;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.06);cursor:pointer" onclick="window.location.href='./select_cliente.html'" title="Cambiar cliente">
      <span id="clienteDot" style="width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--cliente-color)"></span>
      <span id="clienteNombre">Cliente</span>
      <span style="opacity:.6;font-size:10px">⇄ cambiar</span>
    </span>
    <span class="user-chip" id="userEmail"></span>
    <button class="logout-btn" onclick="_sbLogout()">Cerrar sesión</button>
  </div>
</nav>
<h1 id="dispTitle">⚙️ Admin — Dispositivos</h1>
<p class="subtitle" id="dispSubtitle">Edita nombre, versión y estado de cada dispositivo. Los cambios se reflejan inmediatamente en el formulario de checklist.</p>

<div class="card">
  <table id="devTable">
    <thead>
      <tr>
        <th style="width:44px">Orden</th>
        <th style="width:160px">Nombre</th>
        <th style="width:130px">Versión</th>
        <th style="width:80px">Activo</th>
        <th style="width:90px">Mover</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="5" style="text-align:center;color:#7c82a0;padding:32px">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<div class="footer">
  <button class="btn-add" onclick="addRow()">+ Agregar dispositivo</button>
  <button class="btn-save" id="saveBtn" onclick="saveAll()">💾 Guardar cambios</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────
const SUPA_URL='https://akpuifenfstvobwtqtcq.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrcHVpZmVuZnN0dm9id3RxdGNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDMxOTAsImV4cCI6MjEwMjM3OTE5MH0.5397pVE5XlyV2864iTf96Ttj--HqoffovzJ9Z9mI0ig';
const _sbc=supabase.createClient(SUPA_URL,SUPA_KEY);
const H={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
// ── Auth & Roles ─────────────────────────────────────────────────────
let currentRol='operador';
function applyNavRole(rol){
  const isAdmin=rol==='superadmin'||rol==='admin';
  const isSuperAdmin=rol==='superadmin';
  ['navDispositivos','navItems','navBackup'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=isAdmin?'':'none';});
  const navU=document.getElementById('navUsuarios');if(navU)navU.style.display=isSuperAdmin?'':'none';
  const navC=document.getElementById('navClientes');if(navC)navC.style.display=isSuperAdmin?'':'none';
  const b=document.getElementById('roleBadge');
  if(b){b.textContent=rol;b.className='nav-role-badge '+rol;b.style.display='';}
}
(async()=>{
  const{data:{session}}=await _sbc.auth.getSession();
  if(!session){window.location.href='./login.html';return;}
  document.getElementById('userEmail').textContent=session.user.email;
  try{
    const res=await fetch(SUPA_URL+'/rest/v1/profiles?id=eq.'+session.user.id+'&select=nombre,rol',
      {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+session.access_token}});
    if(res.ok){const[p]=await res.json();if(p){currentRol=p.rol||'operador';if(p.nombre)document.getElementById('userEmail').textContent=p.nombre;}}
  }catch(_){}
  applyNavRole(currentRol);
  if(currentRol!=='superadmin'&&currentRol!=='admin'){window.location.href='./dashboard.html';return;}
  load();
})();
async function _sbLogout(){await _sbc.auth.signOut();window.location.href='./login.html';}

let devices=[];
let currentClienteId=null;
let currentClienteNombre='';
(()=>{
  try{
    const raw=sessionStorage.getItem('ditu_cliente');
    if(!raw){window.location.href='./select_cliente.html';return;}
    const c=JSON.parse(raw);
    currentClienteId=c.id||null;
    currentClienteNombre=c.nombre||'Cliente';
    const color=c.color_primario||'#7B2FBE';
    document.documentElement.style.setProperty('--cliente-color', color);
    const chip=document.getElementById('clienteChip');
    if(chip){
      document.getElementById('clienteNombre').textContent=currentClienteNombre;
          const sub=document.getElementById('dispSubtitle');
          if(sub)sub.textContent=`Dispositivos de ${currentClienteNombre} — edita nombre, versión y estado. Los cambios se reflejan inmediatamente en el checklist.`;
          const h1=document.getElementById('dispTitle');
          if(h1)h1.textContent=`⚙️ Admin — Dispositivos ${currentClienteNombre}`;
      document.getElementById('clienteDot').style.background=color;
      chip.style.display='flex';
    }
  }catch(_){window.location.href='./select_cliente.html';}
})();

async function load(){
  const cf=currentClienteId?`&cliente_id=eq.${currentClienteId}`:'';
  const r=await fetch(SUPA_URL+`/rest/v1/checklist_devices?order=orden&select=*${cf}`,{headers:H});
  devices=await r.json();
  render();
}

function render(){
  const tb=document.getElementById('tbody');
  if(!devices.length){tb.innerHTML=`<tr><td colspan="5" style="text-align:center;padding:32px"><div style="font-size:28px;margin-bottom:8px">📱</div><div style="color:#c3a0ff;font-weight:600;margin-bottom:4px">Sin dispositivos para ${currentClienteNombre||'este cliente'}</div><div style="color:#7c82a0;font-size:12px">Agrega el primer dispositivo con el botón de abajo</div></td></tr>`;return;}
  tb.innerHTML=devices.map((d,i)=>`
    <tr data-idx="${i}">
      <td style="color:#7c82a0;font-size:12px;font-weight:600">${d.orden??i+1}</td>
      <td><input type="text" value="${esc(d.nombre)}" placeholder="Nombre" oninput="devices[${i}].nombre=this.value"></td>
      <td><input type="text" value="${esc(d.version??'')}" placeholder="Versión" oninput="devices[${i}].version=this.value"></td>
      <td>
        <label class="toggle">
          <input type="checkbox" ${d.activo?'checked':''} onchange="devices[${i}].activo=this.checked">
          <span class="slider"></span>
        </label>
      </td>
      <td>
        <div class="order-cell">
          <button class="arrow-btn" onclick="moveUp(${i})" title="Subir" ${i===0?'disabled':''}>▲</button>
          <button class="arrow-btn" onclick="moveDown(${i})" title="Bajar" ${i===devices.length-1?'disabled':''}>▼</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function esc(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function moveUp(i){
  if(i===0)return;
  [devices[i],devices[i-1]]=[devices[i-1],devices[i]];
  reorder();render();
}
function moveDown(i){
  if(i===devices.length-1)return;
  [devices[i],devices[i+1]]=[devices[i+1],devices[i]];
  reorder();render();
}
function reorder(){devices.forEach((d,i)=>d.orden=i+1);}

function addRow(){
  devices.push({id:null,nombre:'',version:'',activo:true,orden:devices.length+1,clave:'nuevo_'+Date.now()});
  render();
  // focus last nombre input
  setTimeout(()=>{const inputs=document.querySelectorAll('#tbody input[type=text]');if(inputs.length)inputs[inputs.length-2].focus();},50);
}

async function saveAll(){
  const btn=document.getElementById('saveBtn');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Guardando...';
  try{
    for(const d of devices){
      if(!d.nombre.trim())continue;
      if(!d.clave||d.clave.startsWith('nuevo_')){
        // generate clave from nombre + version to avoid duplicates
        const base=(d.nombre+(d.version?'_'+d.version:'')).toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
        d.clave=base||'device_'+Date.now();
      }
      const body={nombre:d.nombre,version:d.version||'',activo:d.activo,orden:d.orden,clave:d.clave};
      if(currentClienteId)body.cliente_id=currentClienteId;
      if(d.id){
        // update
        await fetch(SUPA_URL+'/rest/v1/checklist_devices?id=eq.'+d.id,{method:'PATCH',headers:H,body:JSON.stringify(body)});
      }else{
        // insert
        const r=await fetch(SUPA_URL+'/rest/v1/checklist_devices',{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(body)});
        const result=await r.json();
        if(!r.ok)throw new Error(result.message||result.error||'Error al insertar');
        const created=Array.isArray(result)?result[0]:result;
        if(created?.id)d.id=created.id;
      }
    }
    showToast('✅ Cambios guardados correctamente');
    await load();
  }catch(e){
    showToast('❌ Error: '+e.message,true);
  }finally{
    btn.disabled=false;btn.innerHTML='💾 Guardar cambios';
  }
}

function showToast(msg,isError=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast'+(isError?' error':'')+' show';
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
