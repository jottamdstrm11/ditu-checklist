<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>Checklist DITU</title>
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
  --text:#e8eaf0;--dim:#7c82a0;
  --pass:#1a4731;--pass-t:#4ade80;
  --fail:#4a1a1a;--fail-t:#f87171;
  --na:#2a2d3e;--na-t:#7c82a0;
  --utt:#3d3010;--utt-t:#fbbf24;
  --accent:#6366f1;
  --cliente-color:#6366f1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:13px}

.screen{display:none}
#screenSetup.active,#screenSuccess.active{display:block;height:100%;overflow-y:auto}
#screenChecklist.active{display:flex;flex-direction:column;height:100%;overflow:hidden}

/* SETUP */
.setup-wrap{max-width:480px;margin:0 auto;padding:40px 20px}
.logo{text-align:center;margin-bottom:32px}
.logo-banner{margin-bottom:0}
.logo-svg{width:220px;height:auto;display:block;margin:0 auto}
.logo h1{font-size:20px;font-weight:800}
.logo h1 span{color:var(--accent)}
.logo-brand{width:140px;height:auto;display:block;margin:10px auto 6px;border-radius:6px}
.logo .sub{font-size:12px;color:var(--dim);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;font-weight:600}
.card select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;outline:none}
.card select:focus{border-color:var(--accent)}
.type-toggle{display:flex;gap:8px}
.type-btn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--dim);cursor:pointer;font-size:13px;font-weight:600;text-align:center;transition:all .15s}
.type-btn.active{background:var(--cliente-color);border-color:var(--cliente-color);color:#fff}
.franja-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.franja-btn{padding:8px 4px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--dim);cursor:pointer;font-size:12px;text-align:center;transition:all .15s}
.franja-btn.active{background:var(--cliente-color);border-color:var(--cliente-color);color:#fff}
.start-btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--cliente-color);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.start-btn:disabled{opacity:.4;cursor:not-allowed}

/* CHECKLIST LAYOUT */
.cl-header{
  flex:0 0 auto;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 16px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
}
.cl-header .op{font-weight:700;font-size:14px}
.cl-header .meta{font-size:11px;color:var(--dim)}
.progress-bar{flex:0 0 3px;background:var(--border)}
.progress-fill{height:100%;background:var(--cliente-color);transition:width .3s}
.table-container{flex:1 1 0;overflow:auto;min-height:0;padding-bottom:140px}
.cl-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:2px solid var(--accent);padding:10px 16px;z-index:50;display:flex;align-items:center;gap:12px}
.send-btn{flex:1;padding:13px;border-radius:8px;border:none;background:var(--cliente-color);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.send-btn:hover:not(:disabled){filter:brightness(1.15)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.bottom-progress{font-size:12px;color:var(--dim);white-space:nowrap;min-width:80px;text-align:right}

/* =============================================
   TABLE — border-separate para que sticky funcione en Chrome
   ============================================= */
table{
  border-collapse:separate;
  border-spacing:0;
  width:100%;
  min-width:860px;
}

/* THEAD sticky — aplicado al <thead> (no al <th>) */
thead{
  position:sticky;
  top:0;
  z-index:20;
}
thead th{
  background:var(--surface2);
  color:var(--dim);font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;
  padding:8px 4px;
  white-space:nowrap;text-align:center;
  /* borders */
  border-bottom:2px solid var(--border);
  border-right:1px solid var(--border);
}
thead th:last-child{border-right:none}

/* Columnas izquierda sticky en thead */
thead th.th-num{
  width:44px;min-width:44px;
  padding:0 6px;
  position:sticky;left:0;z-index:5;
  background:var(--surface2);
}
thead th.th-item{
  width:180px;min-width:150px;
  text-align:left;padding-left:16px;
  position:sticky;left:44px;z-index:5;
  background:var(--surface2);
  border-right:2px solid var(--border);
}

/* SECTION ROWS */
tr.sec-row td{
  background:#13172a;
  color:var(--text);
  font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.08em;
  padding:7px 14px 7px 17px;
  border-top:3px solid var(--bg);
  border-bottom:1px solid rgba(255,255,255,.06);
  border-left:3px solid var(--cliente-color);
}
.sec-actions{float:right}
.sec-pass-btn{
  background:rgba(255,255,255,.08);
  color:var(--cliente-color);
  border:1px solid rgba(255,255,255,.2);
  padding:2px 10px;border-radius:4px;font-size:10px;cursor:pointer;font-weight:700;
}
.sec-pass-btn:hover{background:rgba(255,255,255,.16)}

/* ITEM ROWS */
tr.item-row td{
  border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);
  padding:0;height:34px;vertical-align:middle;
}
tr.item-row td:last-child{border-right:none}
tr.item-row:nth-child(even) td{background:rgba(255,255,255,.025)}

/* STICKY BODY CELLS — solo horizontal */
td.td-num{
  text-align:center;color:var(--dim);font-size:11px;font-weight:600;padding:4px 6px;
  position:sticky;left:0;z-index:5;
  background:var(--bg);
  border-right:1px solid var(--border);
}
tr.item-row:nth-child(even) td.td-num{background:#12151e}

td.td-item{
  padding:6px 16px 6px 16px;font-size:12px;line-height:1.4;
  position:sticky;left:44px;z-index:5;
  background:var(--bg);
  border-right:2px solid var(--border);
  max-width:200px;word-break:break-word;
}
tr.item-row:nth-child(even) td.td-item{background:#12151e}

/* CRITERIO — subrayado punteado + tooltip en hover */
.item-content{display:flex;align-items:flex-start;gap:4px}
.item-content span{flex:1;min-width:0}
.info-btn{background:none;border:none;color:#6366f1;cursor:pointer;font-size:13px;padding:0 2px;line-height:1;flex-shrink:0;opacity:.8}
.info-btn:hover{opacity:1}
.item-popover{display:none;position:fixed;z-index:2000;background:#1a1d27;border:1px solid #6366f1;border-radius:10px;padding:12px 14px;max-width:280px;box-shadow:0 8px 28px rgba(0,0,0,.6)}
.item-popover.show{display:block}
.item-popover-label{font-size:10px;font-weight:700;color:#6366f1;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
#itemPopoverText{font-size:12px;line-height:1.55;color:#e8eaf0;white-space:pre-wrap}

/* STATUS BUTTON */
.s-btn{
  display:block;width:100%;height:34px;
  padding:4px 2px;text-align:center;
  font-size:10px;font-weight:700;cursor:pointer;
  border:none;background:transparent;color:var(--border);
  letter-spacing:.02em;transition:background .1s,color .1s;
}
.s-btn:hover{background:rgba(255,255,255,.06);color:var(--dim)}
.s-btn.PASS{background:var(--pass);color:var(--pass-t)}
.s-btn.FAIL{background:var(--fail);color:var(--fail-t)}
.s-btn.NA{background:var(--na);color:var(--na-t)}
.s-btn.UTT{background:var(--utt);color:var(--utt-t);font-size:8px}

/* SUCCESS */
.success-wrap{max-width:400px;margin:0 auto;padding:60px 20px;text-align:center}
.success-icon{font-size:56px;margin-bottom:20px}
.success-wrap h2{font-size:22px;font-weight:800;margin-bottom:8px}
.success-wrap p{color:var(--dim);margin-bottom:24px}
.btn-row{display:flex;gap:10px;justify-content:center}
.btn-row button{padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:13px}
.btn-row a{padding:10px 20px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;text-decoration:none}

.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{text-align:center;padding:48px;color:var(--dim)}

/* Observation button */
.obs-btn{width:100%;min-width:100px;background:#0f1117;border:1px solid #2e3350;border-radius:6px;color:#7c82a0;padding:5px 8px;font-size:11px;font-family:inherit;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;transition:border .15s,background .15s;line-height:1.4}
.obs-btn:hover{border-color:#6366f1;color:#c3a0ff}
.obs-btn.has-comment{color:#e8eaf0;background:#1e2440;border-color:#6366f1;border-left:3px solid #6366f1;padding-left:7px;font-style:italic}
/* Observation modal */
.obs-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:none;align-items:center;justify-content:center}
.obs-overlay.show{display:flex}
.obs-modal{background:#1a1d27;border:1px solid #2e3350;border-radius:14px;padding:24px;width:90%;max-width:480px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.7)}
.obs-modal-title{font-size:13px;font-weight:700;color:#c3a0ff}
.obs-modal-item{font-size:12px;color:#7c82a0;margin-top:-8px}
.obs-modal textarea{background:#0f1117;border:1px solid #2e3350;border-radius:8px;color:#e8eaf0;padding:12px;font-size:13px;font-family:inherit;resize:none;height:140px;width:100%;outline:none;transition:border .15s;line-height:1.6}
.obs-modal textarea:focus{border-color:#6366f1}
.obs-modal-actions{display:flex;gap:8px;justify-content:flex-end}
.obs-cancel{background:none;border:1px solid #2e3350;color:#7c82a0;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;transition:.15s}
.obs-cancel:hover{border-color:#6366f1;color:#e8eaf0}
.obs-save{background:#6366f1;border:none;color:#fff;border-radius:8px;padding:8px 20px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.obs-save:hover{background:#4f52d9}
/* Modal overlay */
.sitenav{display:flex;gap:4px;padding:8px 14px;background:#0a0c12;border-bottom:1px solid #1e2235;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.snav-link{color:#7c82a0;font-size:12px;font-weight:600;text-decoration:none;padding:5px 11px;border-radius:7px;transition:.15s;display:flex;align-items:center;gap:6px}
.snav-link:hover{color:#e8eaf0;background:#1a1d27}
.snav-link.active{color:#c3a0ff;background:#1a1d27}
.snav-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{font-size:11px;color:#7c82a0}
.logout-btn{background:none;border:1px solid #2e3350;color:#7c82a0;border-radius:7px;padding:4px 10px;font-size:11px;cursor:pointer;transition:.15s}
.logout-btn:hover{color:#f87171;border-color:#f87171}
.nav-role-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:none}
.nav-role-badge.superadmin{background:#4f46e5;color:#fff}
.nav-role-badge.admin{background:#1e2035;color:#c3a0ff;border:1px solid #6366f1}
.nav-role-badge.operador{background:#1a2e1f;color:#4ade80;border:1px solid #166534}
.nav-role-badge.viewer{background:#1a1d27;color:#7c82a0;border:1px solid #2e3350}
.cliente-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#e8eaf0;background:#1a1d27;border:1px solid rgba(180,140,255,0.25);border-radius:8px;padding:3px 10px 3px 6px}
.cliente-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cliente-chip a{color:#7c82a0;font-size:10px;font-weight:600;text-decoration:none;margin-left:4px}
.cliente-chip a:hover{color:#c3a0ff}
</style>
</head>

<script>
// ── Config ──────────────────────────────────────────────────────────
const SUPA_URL='https://akpuifenfstvobwtqtcq.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrcHVpZmVuZnN0dm9id3RxdGNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDMxOTAsImV4cCI6MjEwMjM3OTE5MH0.5397pVE5XlyV2864iTf96Ttj--HqoffovzJ9Z9mI0ig';
const _sbc=supabase.createClient(SUPA_URL,SUPA_KEY);

// ── Cliente activo (multi-tenancy) ────────────────────────────────────
let currentClienteId = null;
(function applyClienteContext() {
  const raw = sessionStorage.getItem('ditu_cliente');
  if (!raw) { window.location.href = './select_cliente.html'; return; }
  try {
    const c = JSON.parse(raw);
    currentClienteId = c.id || null;
    const color = c.color_primario || '#7B2FBE';

    // Aplicar color de cliente como variable CSS global
    document.documentElement.style.setProperty('--cliente-color', color);

    // Actualizar área de logo con identidad del cliente
    const logoArea = document.getElementById('logoArea');
    if (logoArea && c.logo_url) {
      logoArea.innerHTML = `
        <div class="logo-banner" style="margin-bottom:8px">
          <img src="${c.logo_url}" alt="${c.nombre||'Cliente'}"
               style="max-width:240px;max-height:120px;width:auto;height:auto;display:block;margin:0 auto;object-fit:contain"
               onerror="this.style.display='none';document.getElementById('logoFallbackNombre').style.display='block'">
          <div id="logoFallbackNombre" style="display:none;font-size:28px;font-weight:900;color:#fff;text-align:center;letter-spacing:-1px">${c.nombre||'Cliente'}</div>
        </div>
        <div style="font-size:11px;color:var(--dim);text-align:center;margin-top:4px">${c.nombre||''}</div>
      `;
    }

    const chip = document.getElementById('clienteChip');
    if (chip) {
      document.getElementById('clienteNombre').textContent = c.nombre || 'Cliente';
      document.getElementById('clienteDot').style.background = color;
      chip.style.display = '';
    }
  } catch(_) { window.location.href = './select_cliente.html'; }
})();

// ── Auth ─────────────────────────────────────────────────────────────
let currentUser='';
let currentRol='operador';
(async()=>{
  const{data:{session}}=await _sbc.auth.getSession();
  if(!session){window.location.href='./login.html';return;}
  try{
    const res=await fetch(SUPA_URL+'/rest/v1/profiles?id=eq.'+session.user.id+'&select=nombre,rol',
      {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+session.access_token}});
    if(res.ok){
      const[profile]=await res.json();
      if(profile){currentUser=profile.nombre;currentRol=profile.rol||'operador';}
    }
  }catch(_){}
  if(!currentUser)currentUser=session.user.email;
  document.getElementById('userEmail').textContent=currentUser;
  applyNavRole(currentRol);
  if(currentRol==='viewer')document.getElementById('btnStart').disabled=true;
})();
async function _sbLogout(){await _sbc.auth.signOut();window.location.href='./login.html';}
function applyNavRole(rol){
  const isAdmin=rol==='superadmin'||rol==='admin';
  const isSuperAdmin=rol==='superadmin';
  ['navDispositivos','navItems','navBackup','navAnalytics'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=isAdmin?'':'none';});
  const navU=document.getElementById('navUsuarios');if(navU)navU.style.display=isSuperAdmin?'':'none';
  const navC=document.getElementById('navClientes');if(navC)navC.style.display=isSuperAdmin?'':'none';
  const b=document.getElementById('roleBadge');
  if(b){b.textContent=rol;b.className='nav-role-badge '+rol;b.style.display='';}
}
const FRANJAS=['01:00','04:00','07:00','10:00','13:00','16:00','19:00','22:00'];
let selectedType='soporte',selectedFranja='',DEVICES=[],ITEMS={},results={};

async function supa(p){const r=await fetch(SUPA_URL+p,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});return r.json();}

function numSort(a,b){
  const pa=String(a).split('.').map(Number),pb=String(b).split('.').map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const va=pa[i]!==undefined?pa[i]:-1,vb=pb[i]!==undefined?pb[i]:-1;
    if(va!==vb)return va-vb;
  }
  return 0;
}
async function loadConfig(){
  const cf=currentClienteId?`&cliente_id=eq.${currentClienteId}`:'';
  const [devs,items]=await Promise.all([
    supa(`/rest/v1/checklist_devices?activo=eq.true&order=orden&select=*${cf}`),
    supa(`/rest/v1/checklist_items?activo=eq.true&select=*${cf}`)
  ]);
  DEVICES=devs;
  ITEMS={soporte:[],monitoreo:[]};
  ['soporte','monitoreo'].forEach(tipo=>{
    const ti=items.filter(i=>i.tipo===tipo&&i.activo!==false);
    const secs=[...new Set(ti.map(i=>i.seccion))];
    // Ordenar secciones por el numero_item mínimo de cada una (funciona para cualquier cliente)
    const sortedSecs=[...secs].sort((a,b)=>{
      const minA=Math.min(...ti.filter(i=>i.seccion===a).map(i=>parseFloat(i.numero_item)||0));
      const minB=Math.min(...ti.filter(i=>i.seccion===b).map(i=>parseFloat(i.numero_item)||0));
      return minA-minB;
    });
    ITEMS[tipo]=sortedSecs.map(s=>({
      s,
      items:ti.filter(i=>i.seccion===s).map(i=>({n:i.numero_item,t:i.nombre_item,c:i.criterio||''})).sort((a,b)=>numSort(a.n,b.n))
    }));
  });
}
function initFranjas(){
  const now=new Date(),mins=now.getHours()*60+now.getMinutes();
  let auto='10:00';
  if(mins<180)auto='01:00';else if(mins<360)auto='04:00';else if(mins<540)auto='07:00';
  else if(mins<720)auto='10:00';else if(mins<900)auto='13:00';else if(mins<1080)auto='16:00';
  else if(mins<1260)auto='19:00';else auto='22:00';
  selectedFranja=auto;
  document.getElementById('franjaGrid').innerHTML=FRANJAS.map(f=>
    `<div class="franja-btn${f===auto?' active':''}" onclick="selectFranja('${f}')">${f}</div>`
  ).join('');
}
function selectType(t){selectedType=t;document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===t));checkReady();}
function selectFranja(f){selectedFranja=f;document.querySelectorAll('.franja-btn').forEach(b=>b.classList.toggle('active',b.textContent===f));checkReady();}
function checkReady(){document.getElementById('btnStart').disabled=!selectedFranja||!DEVICES.length;}

async function startChecklist(){
  const btn=document.getElementById('btnStart');
  btn.disabled=true;btn.textContent='Verificando...';
  try{
    // Calcular fecha local (misma lógica que enviarChecklist)
    const _n=new Date();const _p=n=>String(n).padStart(2,'0');
    const fechaHoy=`${_n.getFullYear()}-${_p(_n.getMonth()+1)}-${_p(_n.getDate())}`;
    // Verificar si ya existe un run para este cliente+tipo+fecha+franja
    let dupUrl=`/rest/v1/checklist_runs?select=id,operador&fecha=eq.${fechaHoy}&tipo=eq.${selectedType}&hora_franja=eq.${selectedFranja}`;
    if(currentClienteId)dupUrl+=`&cliente_id=eq.${currentClienteId}`;
    const dupRes=await fetch(SUPA_URL+dupUrl,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
    const dups=await dupRes.json();
    if(dups&&dups.length>0){
      const opDup=dups[0].operador||'otro operador';
      const isSuperAdmin=currentRol==='superadmin';
      const msg=`Ya existe un checklist de ${selectedType} para la franja ${selectedFranja} registrado por ${opDup}.\n\n`+
        (isSuperAdmin?'Como superadmin puedes continuar de todas formas.':'Contacta a un administrador si necesitas registrar uno adicional.');
      if(isSuperAdmin){
        if(!confirm(msg+'\n\n¿Continuar de todas formas?')){btn.disabled=false;btn.textContent='Comenzar checklist →';return;}
      } else {
        alert(msg);btn.disabled=false;btn.textContent='Comenzar checklist →';return;
      }
    }
  }catch(e){
    // Si falla la verificación, dejar pasar (no bloquear por error de red)
    console.warn('No se pudo verificar duplicados:',e);
  }
  btn.disabled=false;btn.textContent='Comenzar checklist →';
  const op=currentUser;
  document.getElementById('headerOp').textContent=op;
  document.getElementById('headerMeta').textContent=
    (selectedType==='soporte'?'🟣 Soporte':'🔵 Monitoreo')+' · Franja '+selectedFranja+' · '+
    new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
  results={};observations={};buildTable();show('screenChecklist');updateProgress();
}

function buildTable(){
  const data=ITEMS[selectedType]||[];
  const totalCols=3+DEVICES.length;
  const devH=DEVICES.map(d=>
    `<th>${d.nombre}<br><span style="font-size:8px;font-weight:400;color:var(--dim)">${d.version}</span></th>`
  ).join('');
  let html=`<table><thead><tr>
    <th class="th-num">#</th><th class="th-item">Item de verificación</th>${devH}<th style="min-width:140px">Observaciones</th>
  </tr></thead><tbody>`;
  data.forEach((sec,si)=>{
    html+=`<tr class="sec-row"><td colspan="${totalCols}">📋 ${sec.s}
      <span class="sec-actions"><button class="sec-pass-btn" onclick="passAll(${si})">✓ Todo PASS</button></span>
    </td></tr>`;
    sec.items.forEach((item,ii)=>{
      const devCells=DEVICES.map(d=>{
        const k=`${si}_${ii}_${d.clave}`,st=results[k]||'';
        const lbl=st==='NA'?'N/A':st==='UTT'?'UTT':st||'—';
        return`<td style="padding:3px 4px;vertical-align:top"><button class="s-btn${st?' '+st:''}" onclick="cycleStatus(${si},${ii},'${d.clave}',this)">${lbl}</button></td>`;
      }).join('');
      const obsKey=`${si}_${ii}`;
      const obsVal=observations[obsKey]||'';
      const obsLabel=obsVal?obsVal.replace(/\n/g,' '):'+ Comentario';
      const obsCls=obsVal?'obs-btn has-comment':'obs-btn';
      const itemSpan=item.c
        ?`<span>${item.t}</span><button class="info-btn" data-criterio="${item.c.replace(/"/g,'&quot;').replace(/\n/g,'&#10;')}" onclick="showCriterio(this)" title="Ver criterio de verificación">ℹ️</button>`
        :`<span>${item.t}</span>`;
      html+=`<tr class="item-row"><td class="td-num">${item.n}</td><td class="td-item"><div class="item-content">${itemSpan}</div></td>${devCells}<td style="padding:3px 4px;vertical-align:top"><button class="${obsCls}" onclick="openObsModal('${obsKey}',this)" title="${obsLabel.replace(/"/g,'&quot;')}">${obsLabel}</button></td></tr>`;
    });
  });
  html+='</tbody></table>';
  document.getElementById('tableContainer').innerHTML=html;
}



const CYCLE=['','PASS','FAIL','NA','UTT'];
function cycleStatus(si,ii,devKey,btn){
  const k=`${si}_${ii}_${devKey}`,cur=results[k]||'';
  const next=CYCLE[(CYCLE.indexOf(cur)+1)%CYCLE.length];
  results[k]=next;
  btn.className='s-btn'+(next?' '+next:'');
  btn.textContent=next==='NA'?'N/A':next==='UTT'?'UTT':next||'—';
  updateProgress();
}
function passAll(si){
  const sec=(ITEMS[selectedType]||[])[si];if(!sec)return;
  sec.items.forEach((_,ii)=>DEVICES.forEach(d=>{results[`${si}_${ii}_${d.clave}`]='PASS';}));
  buildTable();updateProgress();
}
function updateProgress(){
  const data=ITEMS[selectedType]||[];
  const total=data.reduce((a,s)=>a+s.items.length*DEVICES.length,0);
  const filled=Object.values(results).filter(v=>v).length;
  const pct=total>0?Math.round(filled/total*100):0;
  const remaining=total-filled;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('headerPct').textContent=filled+'/'+total+' · '+pct+'%';
  const bp=document.getElementById('bottomProgress');
  if(bp)bp.textContent=filled+'/'+total+' · '+pct+'%';
  // Bloquear envío hasta completar el 100%
  const sendBtn=document.getElementById('sendBtn');
  if(sendBtn){
    if(remaining>0){
      sendBtn.disabled=true;
      sendBtn.textContent=`Faltan ${remaining} verificacion${remaining!==1?'es':''}`;
    } else {
      sendBtn.disabled=false;
      sendBtn.innerHTML='✅ Enviar Checklist';
    }
  }
}
async function enviarChecklist(){
  const op=currentUser;
  const btn=document.getElementById('sendBtn');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Enviando...';
  try{
    const hRun={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
    const hRows={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'};

    // 1. Crear el run
    const dataEnvio=ITEMS[selectedType]||[];
    const totalEsperado=dataEnvio.reduce((a,s)=>a+s.items.length*DEVICES.length,0);
    const _now=new Date();const _pad=n=>String(n).padStart(2,'0');
    const localFecha=`${_now.getFullYear()}-${_pad(_now.getMonth()+1)}-${_pad(_now.getDate())}`;
    const runPayload={fecha:localFecha,operador:op,tipo:selectedType,hora_franja:selectedFranja,items_esperados:totalEsperado};
    if(currentClienteId)runPayload.cliente_id=currentClienteId;
    const r1=await fetch(SUPA_URL+'/rest/v1/checklist_runs',{method:'POST',headers:hRun,body:JSON.stringify(runPayload)});
    if(!r1.ok)throw new Error('Error creando run: '+r1.status);
    const [run]=await r1.json();
    if(!run?.id)throw new Error('No se creó el run');

    // 2. Armar filas
    const data=ITEMS[selectedType]||[];const rows=[];
    data.forEach((sec,si)=>sec.items.forEach((item,ii)=>DEVICES.forEach(d=>{
      const estado=results[`${si}_${ii}_${d.clave}`];
      if(estado)rows.push({run_id:run.id,seccion:sec.s,numero_item:item.n,nombre_item:item.t,
        dispositivo:d.nombre,estado:estado==='NA'?'N/A':estado==='UTT'?'UNABLE TO TEST':estado,
        observacion:observations[`${si}_${ii}`]||''});
    })));

    // 3. Enviar en lotes de 100
    if(rows.length){
      const CHUNK=100;
      for(let i=0;i<rows.length;i+=CHUNK){
        const chunk=rows.slice(i,i+CHUNK);
        const pct=Math.round((i+chunk.length)/rows.length*100);
        btn.innerHTML=`<span class="spinner"></span> Enviando... ${pct}%`;
        const r2=await fetch(SUPA_URL+'/rest/v1/checklist_results',{method:'POST',headers:hRows,body:JSON.stringify(chunk)});
        if(!r2.ok){
          // Si falla un lote, eliminar el run huérfano
          await fetch(SUPA_URL+'/rest/v1/checklist_runs?id=eq.'+run.id,{method:'DELETE',headers:hRows});
          throw new Error('Error guardando resultados (lote '+(i/CHUNK+1)+'): '+r2.status);
        }
      }
    }

    const total=rows.length,pass=rows.filter(r=>r.estado==='PASS').length;
    document.getElementById('successMsg').textContent=`${total} verificaciones · ${pass} PASS (${total>0?Math.round(pass/total*100):0}%) · ${op}`;
    show('screenSuccess');
  }catch(e){
    alert('Error: '+e.message);
    btn.disabled=false;btn.innerHTML='✅ Enviar Checklist';
  }
}
function resetForm(){results={};observations={};checkReady();show('screenSetup');}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

// ── Criterio popover ──────────────────────────────
let _popSrc=null;
// ── Observation modal ─────────────────────────────────────────────
let _obsKey=null,_obsBtn=null;
function openObsModal(key,btn){
  _obsKey=key;_obsBtn=btn;
  document.getElementById('obsModalText').value=observations[key]||'';
  document.getElementById('obsOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('obsModalText').focus(),80);
}
function closeObsModal(){
  document.getElementById('obsOverlay').classList.remove('show');
  _obsKey=null;_obsBtn=null;
}
function saveObsModal(){
  const val=document.getElementById('obsModalText').value.trim();
  if(_obsKey!==null){
    observations[_obsKey]=val;
    if(_obsBtn){
      _obsBtn.textContent=val?val.replace(/\n/g,' '):'+ Comentario';
      _obsBtn.title=val?val.replace(/\n/g,' '):'+ Comentario';
      _obsBtn.className=val?'obs-btn has-comment':'obs-btn';
    }
  }
  closeObsModal();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeObsModal();});

function showCriterio(btn){
  const text=btn.dataset.criterio||'';
  const p=document.getElementById('itemPopover');
  if(_popSrc===btn&&p.classList.contains('show')){p.classList.remove('show');_popSrc=null;return;}
  document.getElementById('itemPopoverText').textContent=text;
  _popSrc=btn;
  p.classList.add('show');
  const r=btn.getBoundingClientRect();
  const pw=270;
  let left=r.left;
  if(left+pw>window.innerWidth-12)left=window.innerWidth-pw-12;
  let top=r.bottom+6;
  if(top+120>window.innerHeight)top=r.top-p.offsetHeight-6;
  p.style.left=left+'px';
  p.style.top=top+'px';
}
document.addEventListener('click',e=>{
  const p=document.getElementById('itemPopover');
  if(p&&!e.target.classList.contains('info-btn')){p.classList.remove('show');_popSrc=null;}
},true);

(async()=>{
  initFranjas();
  await loadConfig();
  // Auto-detectar cuántos tipos tienen ítems y ocultar el toggle si solo hay uno
  const tiposConItems=['soporte','monitoreo'].filter(t=>ITEMS[t]&&ITEMS[t].length>0);
  if(tiposConItems.length===1){
    selectedType=tiposConItems[0];
    document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===selectedType));
    const cardTipo=document.getElementById('cardTipo');
    if(cardTipo)cardTipo.style.display='none';
  } else if(tiposConItems.length===0){
    const cardTipo=document.getElementById('cardTipo');
    if(cardTipo)cardTipo.style.display='none';
  }
  checkReady();
})();
</script>
